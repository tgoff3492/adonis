<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adonis</title>
<meta name="theme-color" content="#263A56" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1828" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Adonis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --ink:#1D2C42; --muted:#5E6A78; --line:#E0E4DE; --field:#F3F5F2;
  --protein:#C23B2E; --carbs:#2766B0; --fat:#C99414; --cal:#2E8B57; --focus:#2766B0;
  --hero:#263A56; --hero-muted:#B9C4D3; --soft:#E2E8EF; --warnbg:#FBE7E4;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#142033; --surface:#1E2D44; --ink:#E7EAE4; --muted:#A3AEBA; --line:#2E405A; --field:#263852;
    --protein:#E0604F; --carbs:#7CAAE2; --fat:#E2B43A; --cal:#4DB07A; --focus:#7FB0EC;
    --hero:#0E1828; --hero-muted:#9AA8BA; --soft:#2A3C56; --warnbg:#3A2526;
  }
}
:root[data-theme="dark"]{
  --bg:#142033; --surface:#1E2D44; --ink:#E7EAE4; --muted:#A3AEBA; --line:#2E405A; --field:#263852;
  --protein:#E0604F; --carbs:#7CAAE2; --fat:#E2B43A; --cal:#4DB07A; --focus:#7FB0EC;
  --hero:#0E1828; --hero-muted:#9AA8BA; --soft:#2A3C56; --warnbg:#3A2526;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.datebar{display:flex;align-items:center;gap:8px}
.datebar h1{flex:1;margin:0;font:700 30px/1 var(--display);letter-spacing:.01em}
.datebar h1 small{display:block;font:500 15px/1.3 var(--body);color:var(--muted);margin-top:4px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:18px}
.todaybtn{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.status{font-size:13px;color:var(--muted);margin-top:6px;min-height:18px}

h2{font:700 24px/1.1 var(--display);margin:22px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.ex.linked{border-left:4px solid var(--carbs)}
.exhead{display:flex;align-items:baseline;gap:10px}
.exnum{font:700 18px var(--display);color:var(--muted);min-width:26px}
.exname{font:600 20px/1.15 var(--display);flex:1}
.exnote{font-size:13px;color:var(--muted);margin:2px 0 8px 36px}
.sets{display:grid;gap:6px;margin-left:36px}
.set{display:grid;grid-template-columns:22px 1fr 14px 1fr 44px;align-items:center;gap:6px}
.set .n{font:600 15px var(--display);color:var(--muted)}
.set .x{color:var(--muted);text-align:center}
.set input,.field input{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);font-variant-numeric:tabular-nums}
.done{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-size:18px;color:var(--muted)}
.set.is-done .done{background:var(--cal);border-color:var(--cal);color:#fff}
.set.is-done input{opacity:.7}
.primary{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:700 19px var(--display);letter-spacing:.02em;cursor:pointer;margin-top:14px}
.primary.ok{background:var(--cal);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px 14px;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.plates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 6px}
.plate{text-align:center}
.plate svg{width:100%;max-width:112px;display:block;margin:0 auto}
.plate .val{font:700 22px/1 var(--display)}
.plate .lbl{font-size:13px;color:var(--muted);margin-top:4px}
.plate .left{font-size:12px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field.wide{grid-column:1/-1}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .nm{flex:1;min-width:0}
.entry .nm b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .mac{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px;width:36px;height:36px;border-radius:50%}
.empty{color:var(--muted);margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font:700 26px/1 var(--display)}
.stat span{font-size:13px;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.chart svg{width:100%;display:block}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px;margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:14px 0;cursor:pointer;font:600 18px var(--display);color:var(--muted);border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.plate circle.fill{transition:stroke-dashoffset .5s ease}}

/* ---------- plan + builder ---------- */
.plancard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0 4px;display:flex;align-items:center;gap:10px}
.plancard .t{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.plancard .t b{display:block;color:var(--ink);font:600 17px/1.2 var(--display)}
.linkbtn{border:1px solid var(--line);background:var(--field);border-radius:20px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.linkbtn.go{background:var(--protein);border-color:var(--protein);color:#fff}
.warn{border:1px solid var(--protein);border-left:4px solid var(--protein);border-radius:0;background:var(--surface);padding:10px 12px;margin:10px 0;font-size:14px}
.warn b{color:var(--protein)}
details.notes{margin:8px 0 0;font-size:14px;color:var(--muted)}
details.notes summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.notes ul{margin:6px 0 0;padding-left:18px}
.swaps{display:flex;gap:6px;margin-left:36px;margin-top:8px;flex-wrap:wrap;align-items:center}
.swaps button{border:1px solid var(--line);background:var(--field);border-radius:16px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.swaps .was{font-size:12px;color:var(--muted)}
#builder{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#builder .in{max-width:560px;margin:0 auto;padding:16px 16px 120px}
#builder .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#builder .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
#builder .bar i{display:block;height:100%;background:var(--protein);transition:width .25s}
#builder h2{font:700 28px/1.1 var(--display);margin:18px 0 6px}
#auth{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#auth .in{max-width:440px;margin:0 auto;padding:28px 18px 60px}
#auth h2{font:700 30px/1.1 var(--display);margin:6px 0 6px;text-align:center}
#auth .sub{text-align:center}
#auth form .field{margin-bottom:12px}
#auth .field input,.acct .field input{font-size:17px;padding:12px}
#auth .alt{display:block;margin:16px auto 0;border:0;background:none;color:var(--carbs);font:600 15px var(--body);cursor:pointer;padding:8px}
#auth .note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--muted);margin-top:18px}
#auth .ok{color:var(--cal);font-size:14px;min-height:20px;margin-top:8px}
#auth .spin{width:34px;height:34px;margin:30px auto 10px;border:4px solid var(--line);border-top-color:var(--protein);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.acct-card{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;flex:none;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 22px var(--display)}
.acct-card b{display:block;font-size:17px}
.acct-card small{color:var(--muted);font-size:14px;word-break:break-all}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cal);margin-right:6px;vertical-align:1px}
.syncdot.off{background:var(--fat)}.syncdot.err{background:var(--protein)}
.acct h3{font:700 20px var(--display);margin:22px 0 8px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font:500 17px/1.3 var(--body)}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.opt .box{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex:none;display:grid;place-items:center;font-size:14px;color:#fff}
.opt.single .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink)}
.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bnav .in2{max-width:560px;margin:0 auto;display:flex;gap:10px}
.bnav button{flex:1;padding:14px;border-radius:10px;font:700 19px var(--display);cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.bnav button.next{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bnav button:disabled{opacity:.4;cursor:default}
/* program overview */
.ov-hero{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:4px 0 12px}
.ov-hero .k{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ov-hero h3{font:700 30px/1.05 var(--display);margin:4px 0 4px}
.ov-hero .when{color:var(--muted);font-size:15px}
.ov-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ov-nums div{background:var(--field);border-radius:10px;padding:10px}
.ov-nums b{display:block;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.ov-nums span{font-size:12px;color:var(--muted)}
.ov-write p{margin:0 0 10px;line-height:1.5}
.ov-write p:last-child{margin-bottom:0}
.ov-weeks{list-style:none;margin:0;padding:0}
.ov-weeks li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.ov-weeks li:first-child{border-top:0;padding-top:0}
.ov-weeks b{font:700 16px var(--display)}
.ov-weeks small{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ov-cal{display:grid;grid-template-columns:32px repeat(7,minmax(0,1fr));gap:3px}
.ov-cal .h{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:2px;text-transform:uppercase}
.ov-cal .wk{font:700 12px/1.1 var(--display);color:var(--muted);display:flex;flex-direction:column;justify-content:center;white-space:nowrap}
.ov-cal .wk em{font:600 9px var(--body);font-style:normal;text-transform:uppercase;letter-spacing:.03em}
.ov-cal button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:52px;padding:4px 2px 5px 3px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;font:inherit;min-width:0}
.ov-cal button .d{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ov-cal button .n{font:600 10.5px/1.15 var(--display);letter-spacing:-.01em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:normal;word-break:normal;max-width:100%}
.ov-cal button.on{border-top:3px solid var(--protein)}
.ov-cal button.off{background:var(--field)}
.ov-cal button.off .n{color:var(--muted);font-weight:500}
.ov-cal button.light{border-top-color:var(--carbs)}
.ov-cal button.today{outline:2px solid var(--focus);outline-offset:-1px}
.ov-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.ov-key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ov-bars{display:grid;grid-template-columns:86px 1fr 28px;gap:6px 10px;align-items:center;font-size:14px}
.ov-bars .bar{height:10px;border-radius:5px;background:var(--field);overflow:hidden}
.ov-bars .bar i{display:block;height:100%;background:var(--protein);border-radius:5px}
.ov-bars b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.ov-day summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ov-day summary::-webkit-details-marker{display:none}
.ov-day summary b{font:600 18px var(--display);flex:1}
.ov-day summary span{font-size:13px;color:var(--muted);white-space:nowrap}
.ov-day summary::after{content:"+";font:600 20px/1 var(--display);color:var(--muted);margin-left:4px}
.ov-day[open] summary::after{content:"–"}
.ov-day ol{margin:8px 0 0;padding-left:20px;font-size:15px}
.ov-day ol .sub{margin:0}
.pday{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.pday b{font:600 18px var(--display)}
.pday ol{margin:6px 0 0;padding-left:20px;font-size:15px}
.pday .rest{color:var(--muted);font-size:14px}
.err{color:var(--protein);font-size:14px;min-height:20px;margin-top:8px}

.msg{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cal);border-radius:0;padding:12px 14px;margin:12px 0}
.msg.adj{border-left-color:var(--carbs)}
.msg p{margin:0 0 10px}
.msg .acts{display:flex;gap:8px;flex-wrap:wrap}
.nsum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0 4px}
.nsum .k{font-size:13px;color:var(--muted)}
.nsum .big{font:700 34px/1 var(--display)}
.nsum .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.flds .field input{font-size:18px;padding:12px}
.flds .wide{grid-column:1/-1}
.tip{font-size:13px;color:var(--muted);margin-top:4px}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

.meal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.meal .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meal .nm{font:600 20px/1.15 var(--display);margin:2px 0}
.meal .mac{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.meal details{margin-top:6px;font-size:14px}
.meal details summary{cursor:pointer;color:var(--ink);font-weight:600}
.meal .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mcar{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;align-items:flex-start;margin:0 -16px;padding:0 16px;scroll-padding:0 16px}
.mcar::-webkit-scrollbar{display:none}
.mcar .meal{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;margin-bottom:0}
.dots{display:flex;justify-content:center;gap:4px;margin:10px 0 4px}
.dots .dot{width:28px;height:28px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.dots .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);transition:width .2s,background .2s}
.dots .dot[aria-selected="true"]::after{width:22px;border-radius:4px;background:var(--ink)}
.meal .mtag{font-size:13px;color:var(--protein);font-weight:600;margin:2px 0 2px}
.meal ol.steps{margin:8px 0 0;padding-left:22px;font-size:15px;line-height:1.5}
.meal ol.steps li{margin:0 0 8px}
.meal .xtra{font-size:14px;margin:6px 0 0;padding:8px 10px;background:var(--field);border-radius:8px}
.prepnote{background:var(--field);border-left:3px solid var(--blue);border-radius:8px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.prepsteps{margin:0;padding-left:22px;font-size:15px;line-height:1.5}
.prepsteps li{margin:0 0 10px}
.meal .linkbtn.done{background:var(--cal);border-color:var(--cal);color:#fff}
.mtools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.glist label{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.glist label:first-of-type{border-top:0}
.glist input{width:20px;height:20px;flex:none}
.glist .amt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.glist label.got span:first-of-type{text-decoration:line-through;color:var(--muted)}

#scanner{position:fixed;inset:0;z-index:60;background:#000;color:#fff}
#scanvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanframe{position:absolute;left:10%;right:10%;top:32%;height:22%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.scantop{position:absolute;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:12px;font:600 17px var(--body)}
.scantop .iconbtn{background:rgba(255,255,255,.15);border-color:transparent;color:#fff}
.scanbottom{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.7)}
.scanbottom label{font-size:14px;display:block;margin-bottom:6px}
.row2{display:flex;gap:8px}
.row2 input{flex:1;min-width:0;padding:12px;border-radius:8px;border:0;font-size:18px;background:#fff;color:#111}
.food{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.food .brand{font-size:13px;color:var(--muted)}
.food .fn{font:600 22px/1.15 var(--display);margin:2px 0 8px}
.stepper{display:flex;align-items:center;gap:10px;margin:10px 0}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--field);font-size:22px;cursor:pointer}
.stepper input{width:80px;text-align:center;font-size:20px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--field)}

.fsearch{display:flex;gap:8px;margin:0 0 10px}
.fsearch input{flex:1;min-width:0;padding:13px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:17px}
.fsearch .linkbtn{padding:0 18px;font-size:16px}
.fres{padding:4px 14px;margin-bottom:12px}
.left{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin:0 0 10px;font-size:14px;color:var(--muted)}
.left b{color:var(--ink);font-variant-numeric:tabular-nums}
.left .lp b{color:var(--protein)} .left .lc b{color:var(--carbs)} .left .lf b{color:var(--fat)}
.left .ok{color:var(--cal)} .left.done{color:var(--cal);font-weight:600}
.qa .qah{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.qa .qah b{font:700 20px/1.1 var(--display)}
.qa #fcal{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--muted)}
.qarow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.qm{display:flex;flex-direction:column;background:var(--field);border:1px solid var(--line);border-top:3px solid var(--qc,var(--line));border-radius:10px;padding:8px 10px 6px;position:relative;cursor:text}
.qm span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.qm input{border:0;background:none;padding:2px 18px 0 0;font:700 26px/1.1 var(--display);width:100%;min-width:0;color:var(--ink)}
.qm input:focus{outline:none}
.qm input::placeholder{color:var(--muted);opacity:.4}
.qm:focus-within{border-color:var(--qc);box-shadow:0 0 0 2px color-mix(in srgb,var(--qc) 25%,transparent)}
.qm i{position:absolute;right:10px;bottom:9px;font-style:normal;color:var(--muted);font-size:14px}
.qp{--qc:var(--protein)} .qc{--qc:var(--carbs)} .qf{--qc:var(--fat)}
.qa .row2{display:flex;gap:8px}
.qa .row2 input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:16px}
.qa .row2 .primary{width:auto;margin:0;padding:0 22px}
.frow .plus{width:32px;height:32px;border-radius:50%;background:var(--field);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;line-height:1;color:var(--ink);flex:none}
.fres button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;cursor:pointer}
.fres button:first-child{border-top:0}
.fres .nm2{flex:1;min-width:0}
.fres .nm2 b{display:block;font-weight:600}
.fres .nm2 span{font-size:13px;color:var(--muted)}
.fres .cal{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}

.exnote .sug{color:var(--ink);font-weight:600}
details.cue{margin:0 0 8px 36px;font-size:14px}
details.cue summary{cursor:pointer;color:var(--carbs);font-weight:600}
details.cue ul{margin:6px 0 0;padding-left:18px;color:var(--ink)}
/* ---------- today ---------- */
.hero{margin:14px 0 12px;padding:18px 16px 16px;border-radius:14px;background:var(--ink);color:var(--bg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:0;bottom:0;width:120px;background:repeating-linear-gradient(115deg,var(--protein) 0 14px,transparent 14px 28px);opacity:.9}
.hero .kick{font:700 14px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--protein);position:relative;z-index:1}
.hero .hl{font:800 42px/0.98 var(--display);font-style:italic;text-transform:uppercase;margin:4px 0 6px;max-width:78%;position:relative;z-index:1}
.hero .tag{margin:0;font-size:15px;opacity:.82;max-width:74%;position:relative;z-index:1}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.tcard .th{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.tcard .th b{font:700 20px/1.1 var(--display);flex:1}
.tcard .th span{font-size:13px;color:var(--muted)}
.tcard p{margin:0 0 10px;color:var(--muted);font-size:15px}
.tcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.tcard .primary{margin-top:4px}
.meter{margin:8px 0}
.meter .ml{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.meter .ml b{font-weight:600}
.meter .mb{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter .mb i{display:block;height:100%;border-radius:5px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 10px}
.wk div{text-align:center;font-size:12px;color:var(--muted)}
.wk i{display:block;margin:4px auto 0;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);font-style:normal;line-height:26px;font-size:14px;color:#fff}
.wk .plan i{border-color:var(--ink)}
.wk .did i{background:var(--cal);border-color:var(--cal)}
.wk .miss i{border-style:dashed}
.wk .sick i{background:var(--field);border-color:var(--line);color:var(--muted)}
.lifenote p{margin:0}.lifenote p+p{margin-top:8px}
.trips .log li{align-items:center}
.wk .now{color:var(--ink);font-weight:700}
.ci{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.ci input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:17px}
/* ---------- exercise demos ---------- */
.fdemo{margin:10px 0 4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px 2px}
.fdemo[hidden]{display:none}
.fdemo .demo-svg{display:block;width:100%;height:auto;max-height:190px}
.fdemo .demo-pair{display:flex;gap:6px}.fdemo .demo-pair .demo-svg{width:50%}
.fdemo .demo-vid{display:block;width:100%;height:auto;max-height:260px;margin:2px 0 6px;border-radius:8px;background:#000;object-fit:contain}
.fdemo .demo-cap{font-size:12px;color:var(--muted);text-align:center;padding-bottom:4px}
details.cue .fdemo{margin:8px 0 6px}
.dp-floor{stroke:var(--line);stroke-width:2}
.dp-body,.dp-limb{stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round;fill:none}
.dp-far{stroke:var(--muted);opacity:.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.dp-head{fill:var(--ink)}
.dp-halo{stroke:var(--surface);stroke-linecap:round;stroke-linejoin:round;fill:none}
.dp-fist{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.dp-torso{fill:var(--ink);stroke:var(--ink);stroke-width:6;stroke-linejoin:round}
.dp-eq{fill:var(--line)}
.dp-eqs{stroke:var(--line);stroke-linecap:round}
.dp-load{fill:var(--protein)}
.dp-loads{stroke:var(--protein);stroke-linecap:round}
.dp-hole{fill:var(--surface)}
.dp-cable{stroke:var(--muted);stroke-width:1.5}
.dp-band{stroke:var(--protein);opacity:.75;stroke-linecap:round}
/* ---------- workout mode ---------- */
.primary.start{background:var(--protein);color:#fff;margin:2px 0 14px;font:800 22px var(--display);font-style:italic;letter-spacing:.03em;text-transform:uppercase;padding:16px}
.planline{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:14px;color:var(--muted)}
.planline .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.planline .t b{color:var(--ink);font-weight:600}
.linkbtn.sm{padding:5px 10px;font-size:13px}
.set input::placeholder{color:var(--muted);opacity:.7;font-weight:400}
.set input.pre::placeholder{color:var(--ink);opacity:.62;font-weight:600}
.exhead .tagpill{align-self:center}
#focus[hidden]{display:none}
#focus{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#focus .fwrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#focus .fin{max-width:560px;margin:0 auto;padding:12px 16px 28px}
#focus .ftop{display:flex;align-items:center;gap:12px}
#focus .fprog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
#focus .fprog i{display:block;height:100%;background:var(--cal);transition:width .3s}
#focus .fcount{font:600 15px var(--display);color:var(--muted);white-space:nowrap}
#focus .fkick{font:700 14px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--protein);margin:18px 0 2px}
#focus .fname{font:800 38px/1 var(--display);font-style:italic;text-transform:uppercase;letter-spacing:.01em;margin:0 0 10px;overflow-wrap:anywhere}
#focus .frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#focus .fsug{margin:10px 0 0;font-size:15px;line-height:1.4}
#focus details.cue{margin:10px 0 0}
#focus .fhint{color:var(--protein);font-size:14px;margin:8px 0 0;min-height:0}
#focus .fsets{margin-top:16px;display:grid;gap:8px}
#focus .fset{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:600 19px var(--display);text-align:left;color:var(--ink);cursor:pointer}
#focus .fset .k{color:var(--muted);min-width:52px}
#focus .fset .v{flex:1;font-variant-numeric:tabular-nums}
#focus .fset .ck{color:var(--cal);font-size:20px}
#focus .fset.todo{color:var(--muted);background:transparent;border-style:dashed;cursor:default}
#focus .fset.isdone{border-color:var(--cal)}
#focus .fset.pr .ck{color:var(--fat)}
#focus .fcur{border:2px solid var(--ink);border-radius:14px;background:var(--surface);padding:14px}
#focus .fcur .lab{font:700 15px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#focus .fnum{display:grid;grid-template-columns:58px 1fr 58px;gap:8px;align-items:center;margin-top:10px}
#focus .fnum button{height:58px;border-radius:12px;border:1px solid var(--line);background:var(--field);font:700 28px var(--display);cursor:pointer;color:var(--ink);touch-action:manipulation}
#focus .fnum label{display:flex;align-items:center;justify-content:center;gap:6px;height:58px;border-radius:12px;border:1px solid var(--line);background:var(--field)}
#focus .fnum input{width:4.2ch;border:0;background:transparent;text-align:right;font:700 34px var(--display);font-variant-numeric:tabular-nums;padding:0;color:var(--ink)}
#focus .fnum input:focus{outline:none}
#focus .fnum label:focus-within{outline:2px solid var(--focus);outline-offset:2px}
#focus .fnum .u{font-size:14px;color:var(--muted);min-width:30px}
#focus .flog{margin-top:12px;width:100%;height:62px;border:0;border-radius:14px;background:var(--cal);color:#fff;font:800 24px var(--display);font-style:italic;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;touch-action:manipulation}
#focus .fdone{margin-top:16px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--cal);font-size:15px}
#focus .fdone b{font:800 22px var(--display);font-style:italic;text-transform:uppercase;color:var(--cal);display:block}
#focus .fnext{margin-top:18px;font-size:14px;color:var(--muted)}
#focus .fnext b{color:var(--ink);font-weight:600}
#focus .fnav{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
#focus .fnav .in2{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
#focus .fnav button{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--field);font:700 18px var(--display);cursor:pointer;color:var(--ink)}
#focus .fnav button:disabled{opacity:.4;cursor:default}
#focus .fnav button.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#focus .fnav button.fin2{background:var(--protein);border-color:var(--protein);color:#fff}
body.focusing{overflow:hidden}
body.focusing #rest{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#rest{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:30;max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#rest .rrow{display:flex;align-items:center;gap:10px}
#rest .rt{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;flex:1}
#rest .rt small{font:500 13px var(--body);opacity:.75;display:block;margin-bottom:2px}
#rest button{border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:18px;padding:8px 12px;font-weight:600;cursor:pointer}
#rest .rbar{height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin-top:8px;overflow:hidden}
#rest .rbar i{display:block;height:100%;background:var(--cal)}
#rest.go{background:var(--cal);color:#fff;animation:restgo .5s ease-in-out 4 alternate}
@keyframes restgo{from{transform:scale(1)}to{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){#rest.go{animation:none}}
#toast.win{background:var(--cal);color:#fff;font-size:17px;padding:12px 18px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:69}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--fat);color:#263A56;font-weight:700;border-radius:24px;padding:10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.25);width:max-content;max-width:min(92vw,420px);text-align:center}
.set .done{font-weight:700}

.recap{background:var(--ink);color:var(--bg);border-radius:12px;padding:14px 16px;margin:14px 0 6px}
.recap h3{margin:0 0 2px;font:700 22px var(--display)}
.recap .rs{opacity:.75;font-size:14px;margin:0 0 10px}
.recap .rg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.recap .rg div{background:rgba(255,255,255,.08);border-radius:8px;padding:10px}
.recap .rg b{display:block;font:700 24px/1.05 var(--display)}
.recap .rg span{font-size:13px;opacity:.8}
.recap ul{margin:10px 0 0;padding-left:18px;font-size:14px}
.recap .linkbtn{margin-top:12px;background:transparent;color:inherit;border-color:rgba(255,255,255,.35)}
.prog .stat b{font-size:24px}
.prs{list-style:none;margin:0;padding:0}
.prs li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.prs li:first-child{border-top:0}
.prs li span:first-child{flex:1;min-width:0}
.prs .d{color:var(--muted);font-size:13px;white-space:nowrap}
body.resting .wrap{padding-bottom:200px}

.tagpill{font-size:13px;font-weight:600;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:3px 9px;white-space:nowrap}
.ex.cardio{border-left:4px solid var(--carbs)}
.ex.circuit{border-left:4px solid var(--protein)}
.moves{margin:0 0 10px 36px;padding-left:18px;font-size:15px}
.moves li{margin:4px 0}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.wordmark{font:800 17px/1 var(--display);letter-spacing:.24em;color:var(--ink)}
.brand{display:inline-flex;align-items:center;gap:9px}
.brand .mark{width:34px;height:27px;color:var(--ink);flex:none}
.mark-sm{width:26px;height:21px;color:var(--ink);flex:none;display:block}
.sheetbrand{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 18px}
.sheetbrand .mark{width:64px;height:51px;color:var(--ink)}
.sheetbrand .wordmark{font-size:22px}
#builder .top:has(+ .sheetbrand) .mark-sm{display:none}
.iconbtn.person{width:38px;height:38px}
.menu-list{display:grid;gap:10px;margin-top:12px}
.menu-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font:600 17px var(--body)}
.menu-item small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.menu-item.danger{color:var(--protein)}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;font-size:15px}
.checkrow input{width:22px;height:22px;flex:none;margin-top:1px}
.dangerbtn{background:var(--protein)!important;color:#fff!important}

/* coaching: mode switch, invite code, roster */
.modesw{display:flex;padding:3px;border-radius:22px;background:var(--field);border:1px solid var(--line)}
.modesw[hidden]{display:none}
.modesw button{border:0;background:none;border-radius:18px;min-height:36px;padding:0 12px;white-space:nowrap;font:600 16px var(--display);color:var(--muted);cursor:pointer}
.modesw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:429px){.topbar:has(.modesw:not([hidden])) .wordmark{display:none}}
.codecard{text-align:center}
.codecard .code{font:700 34px/1.1 var(--display);letter-spacing:.14em;margin:6px 0 4px;user-select:all;-webkit-user-select:all}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btnrow button{flex:1 1 0;min-height:44px;border:1px solid var(--line);background:var(--field);border-radius:22px;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink)}
.client{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.client:first-child{border-top:0}
.client .avatar{width:40px;height:40px;font-size:18px}
.client .nm{flex:1;min-width:0}
.client .nm b{display:block;font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.client .nm small{display:block;font-size:13px;color:var(--muted)}
.client .rm{border:1px solid var(--line);background:var(--field);border-radius:20px;min-height:40px;padding:0 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.flag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;margin-top:4px;border:1px solid var(--protein);color:var(--protein)}
.codein{font:700 24px var(--display)!important;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.client .nmbtn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:44px}
.client .nmbtn .nm{flex:1}
.client .nmbtn .chev{color:var(--muted);font-size:22px;line-height:1}
.coachnote p{white-space:pre-line;margin:0}
.field textarea{width:100%;box-sizing:border-box;min-height:96px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:inherit;font-size:16px;line-height:1.4;resize:vertical}
.coachby{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:2px 10px;margin-bottom:8px}
.kcal{font-size:14px;color:var(--muted);margin:2px 0 6px}
.kcal b{font:700 26px var(--display);color:var(--ink);margin-right:4px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ink)}

/* body sub-tabs */
.reclist{padding:4px 14px}
.rec{border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec summary{display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;list-style:none}
.rec summary::-webkit-details-marker{display:none}
.rec summary::after{content:"›";color:var(--muted);font-size:20px;transition:transform .15s}
.rec[open] summary::after{transform:rotate(90deg)}
.rn{flex:1;min-width:0;font-weight:600}
.rv{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums}
.rec .rreps{margin-bottom:12px}

.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 2px}
.subtab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 4px;font:700 18px/1 var(--display);letter-spacing:.03em;cursor:pointer}
.subtab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.backlink,.inlink{border:0;background:none;color:var(--focus);font:600 15px var(--body);cursor:pointer;padding:0}
.backlink{padding:12px 0 0}
.inlink{text-decoration:underline}

/* ---------- startup splash ---------- */
#home{position:fixed;inset:0;z-index:50;background:#263A56;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:sp-out .4s 4.3s ease forwards}
#home[hidden]{display:none}
#home.leaving{animation:sp-out .3s ease forwards;pointer-events:none}
/* intro: the bar falls off the logo, the camera follows it down, it cracks the screen. Iron sharpening iron. */
#home .in-cam{position:absolute;left:0;top:0;width:100%;height:200vh;animation:in-cam 2.6s both linear}
#home .in-logo{position:absolute;left:50%;top:calc(40vh - 95px);width:240px;height:190px;margin-left:-120px;animation:in-pop .55s .1s both cubic-bezier(.2,1.4,.4,1)}
#home .in-logo svg{position:absolute;left:0;top:0;width:240px;height:190px}
#home .in-bar{animation:in-bar 2.6s both linear;transform-origin:50% 59%}
#home .in-quote{position:absolute;left:0;right:0;top:calc(170vh - 410px);height:240px;margin:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#home .in-quote i{display:flex;flex-direction:column;align-items:center;transform:rotate(-15deg);color:#ECEEEA;font:italic 800 clamp(40px,14.5vw,62px)/.9 var(--display);text-transform:uppercase;letter-spacing:.01em}
#home .in-quote span{display:block;animation:in-word .35s 2.4s both}
#home .in-quote span:nth-of-type(2){color:#E0604F;animation-delay:2.6s}
#home .in-quote span:nth-of-type(3){animation-delay:2.8s}
#home .in-crack{position:absolute;left:50%;top:calc(170vh - 590px);width:390px;height:844px;margin-left:-195px;overflow:visible;pointer-events:none}
#home .in-crack path{stroke-dasharray:1;stroke-dashoffset:1;animation:in-crack .35s 2.13s both ease-out}
#home .in-flash{position:absolute;left:0;top:100vh;width:100%;height:100vh;background:#fff;pointer-events:none;animation:in-flash .4s 2.13s both}
@keyframes in-pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes in-cam{
  0%,42%{transform:translateY(0);animation-timing-function:cubic-bezier(.55,0,1,.45)}
  82%{transform:translateY(-100vh)}
  84%{transform:translate(5px,calc(6px - 100vh))}
  86%{transform:translate(-5px,calc(-5px - 100vh))}
  88%{transform:translate(3px,calc(3px - 100vh))}
  90%{transform:translate(-2px,calc(-2px - 100vh))}
  93%,100%{transform:translateY(-100vh)}
}
@keyframes in-bar{
  0%,30%{transform:none}
  35%{transform:translateY(-3px) rotate(-1.5deg)}
  39%{transform:translateY(-1px) rotate(1.5deg)}
  42%{transform:translateY(0) rotate(0) scale(1);animation-timing-function:cubic-bezier(.55,0,1,.45)}
  82%{transform:translateY(calc(130vh - 65px)) scale(1.4);animation-timing-function:ease-out}
  87%{transform:translateY(calc(130vh - 78px)) scale(1.4)}
  92%,100%{transform:translateY(calc(130vh - 65px)) scale(1.4)}
}
@keyframes in-crack{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes in-flash{0%{opacity:0}10%{opacity:.25}100%{opacity:0}}
@keyframes in-word{0%{opacity:0;transform:scale(1.35)}60%{opacity:1;transform:scale(.97)}100%{opacity:1;transform:scale(1)}}
@keyframes sp-fade{to{opacity:1}}
@keyframes sp-out{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){
  #home{animation:sp-out .4s 2.4s ease forwards}
  #home .in-cam{animation:none;transform:translateY(-100vh)}
  #home .in-logo{animation:none}
  #home .in-bar{animation:none;transform:translateY(calc(130vh - 65px)) scale(1.4)}
  #home .in-crack path{animation:none;stroke-dashoffset:0}
  #home .in-flash{display:none}
  #home .in-quote span,#home .in-quote span:nth-of-type(n){opacity:0;animation:sp-fade .4s .2s both}
}

let S = {settings:{...DEFAULTS}, days:{}, plan:null, profile:{}, nutri:null, blockSeen:{}, mealplan:null, foods:{}, recapSeen:{}, sgoals:[], trips:[]};
const Cloud = window.AdonisCloud;
const MP = window.AdonisMeals;
const N = window.AdonisNutrition;
const E = window.AdonisEngine;
const LF = window.AdonisLife;
let cur = todayStr();
let tab = "today";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function pad(n){return String(n).padStart(2,"0")}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function fmt(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function diff(a,b){return Math.round((parse(a)-parse(b))/864e5)}
function num(v){const n=parseFloat(v);return isFinite(n)?n:0}

function day(d){
  if(!S.days[d]) S.days[d] = {date:d, food:[], lifts:{}, weight:"", bf:"", recovery:[], complete:false};
  return S.days[d];
}
function progInfo(d){
  let idx = diff(d, S.settings.start);
  if(idx < 0) return {before:true, inDays:-idx};
  idx -= LF.pausedBefore(pausedDays(), S.settings.start, d);   // 3+ sick days in a row pause the block
  return {cycle:Math.floor(idx/28)+1, week:Math.floor((idx%28)/7)+1, dn:idx%7+1};
}
/* ---------- sick days and trips (life.js) ---------- */
let PAUSED = {sig:null, set:new Set()};
function pausedDays(){
  const sig = Object.keys(S.days).filter(k=>S.days[k] && S.days[k].sick).sort().map(k=>k+S.days[k].sick+(didWorkout(k)?"+":"")).join();
  if(sig !== PAUSED.sig) PAUSED = {sig, set: LF.pausedDates(S.days, didWorkout)};
  return PAUSED.set;
}
const sickOn = d => (S.days[d] && S.days[d].sick) || "";
function setFactorOn(d){ return S.plan ? LF.setFactor(S.days, d, didWorkout) : 1; }
let TRAVEL = {};   // date -> {original exercise: travel swap}; cleared on every render
function tripOn(d){ return LF.tripOn(S.trips, d); }
function travelFor(d){
  if(d in TRAVEL) return TRAVEL[d];
  let m = null; const trip = tripOn(d);
  if(trip && S.plan){ const p = progInfo(d), P = p.before ? null : dayDef(p.dn); if(P && !P.rest) m = LF.tripSwaps(P.ex, trip, S.plan.ctx, E); }
  return TRAVEL[d] = m;
}
const isTravelSwap = (e, D) => !(D.swap && D.swap[e.n]) && !!travelFor(D.date) && e.n in travelFor(D.date);

function dayDef(dn){ return S.plan ? S.plan.days[dn-1] : null; }
function weekNote(w){ return S.plan ? S.plan.weekNotes[w-1] : ""; }
// d: the day it's for, so sick days and the first sessions back get fewer sets
function rx(e, w, d){ const r = e.wk ? e.wk[w-1] : {s:3, r:"10"}; if(!d) return r; const f = setFactorOn(d); return f > 0 && f < 1 ? {...r, s: LF.scaleSets(r.s, f)} : r; }
function shown(e, D){ if(D.swap && D.swap[e.n]) return D.swap[e.n]; const t = D.date ? travelFor(D.date) : null; return (t && t[e.n]) || e.n; }
function isBW(name, e){ const x = E && E.BY_NAME[name]; return x ? (x.eq.length===0 && x.p!=="cond") : !!e.bw; }

/* ---------- storage ---------- */
function cacheLocal(){try{localStorage.setItem("adonis-v1", JSON.stringify(S))}catch(e){} Cloud.touch()}
function fromObj(o){o=o||{};return {settings:{...DEFAULTS,...o.settings},days:o.days||{},plan:o.plan||null,profile:o.profile||{},nutri:o.nutri||null,blockSeen:o.blockSeen||{},mealplan:o.mealplan||null,foods:o.foods||{},recapSeen:o.recapSeen||{},sgoals:o.sgoals||[],trips:o.trips||[]}}
function loadLocal(){try{const r=localStorage.getItem("adonis-v1");if(r)S=fromObj(JSON.parse(r))}catch(e){}}
function setStatus(t){$("#status").textContent=t}
const timers = {};
function saveDay(d){
  try{ checkMacroWins(d); }catch(e){}
  clearTimeout(timers[d]);
  timers[d] = setTimeout(()=>{cacheLocal();setStatus("Saved")},300);
}
function saveSettings(){
  clearTimeout(timers.settings);
  timers.settings = setTimeout(()=>{cacheLocal();setStatus("Saved")},300);
}

/* ---------- backup ---------- */
function markBackup(){ S.settings.lastBackup = todayStr(); S.settings.backupSnooze = ""; cacheLocal(); render(); }
function backupBanner(){
  if(Cloud.user) return "";   // signed in: logs are saved to the account
  const logged = Object.keys(S.days).length;
  if(logged < 3) return "";
  const last = S.settings.lastBackup, sn = S.settings.backupSnooze;
  if(sn && diff(todayStr(), sn) < 3) return "";
  const days = last ? diff(todayStr(), last) : null;
  if(days !== null && days < 14) return "";
  return `<div class="msg adj"><p>${days===null ? "You haven't backed up yet." : `It's been ${days} days since your last backup.`} Your logs live only on this phone, so a backup keeps them safe.</p><div class="acts"><button class="linkbtn go" id="export">Save backup</button><button class="linkbtn" data-act="backup-later">Later</button></div></div>`;
}
async function exportData(){
  const name = `adonis-backup-${todayStr()}.json`;
  const blob = new Blob([JSON.stringify({app:"adonis",version:1,exported:new Date().toISOString(),...S},null,1)],{type:"application/json"});
  try{
    const file = new File([blob], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Adonis backup"});
      markBackup(); setStatus("Backup saved"); return;
    }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  markBackup(); setStatus("Backup downloaded");
}
async function importData(file){
  try{
    const o = JSON.parse(await file.text());
    if(!o || typeof o!=="object" || !o.days) throw new Error("bad");
    const n = Object.keys(o.days).length;
    if(!confirm(`Restore this backup (${n} logged day${n===1?"":"s"})? Days in the backup replace the same days on this phone.`)) return;
    S.settings = {...DEFAULTS, ...S.settings, ...(o.settings||{})};
    for(const d in o.days) S.days[d] = o.days[d];
    if(o.plan) S.plan = o.plan;
    if(o.profile) S.profile = {...S.profile, ...o.profile};
    if(o.nutri) S.nutri = o.nutri;
    if(o.mealplan) S.mealplan = o.mealplan;
    if(o.foods) S.foods = {...(S.foods||{}), ...o.foods};
    if(Array.isArray(o.sgoals)) S.sgoals = o.sgoals;
    cacheLocal(); render(); setStatus("Backup restored");
  }catch(e){ setStatus("That file isn't an Adonis backup.") }
}

/* ---------- header ---------- */

  const d = parse(cur), t = todayStr();
  const label = cur===t ? "Today" : cur===addDays(t,-1) ? "Yesterday" : cur===addDays(t,1) ? "Tomorrow"
    : d.toLocaleDateString(undefined,{weekday:"long"});
  const p = progInfo(cur);
  let sub = d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  $("#dtitle").innerHTML = `${esc(label)}<small>${esc(sub)}</small>`;

/* ---------- train ---------- */
const CO = window.AdonisCoach;
function sessionsFor(name, before){
  // newest first: each is the list of sets with reps logged, tagged with that day's rep target
  const out = [];
  Object.keys(S.days).filter(k=>k<before).sort().reverse().forEach(k=>{
    const sets = S.days[k].lifts?.[name];
    if(sets && sets.some(s=>num(s.r)>0)){ const a = sets.filter(s=>num(s.r)>0); a.rx = S.days[k].rx?.[name] || null; out.push(a); }
  });
  return out;
}
function bestE1(name, before){
  let b = 0;
  Object.keys(S.days).filter(k=>k<before).forEach(k=>{ (S.days[k].lifts?.[name]||[]).forEach(s=>{ b = Math.max(b, CO.e1rm(num(s.w), num(s.r))); }); });
  return b;
}
function lastFor(name){
  const dates = Object.keys(S.days).filter(k=>k<cur).sort().reverse();
  for(const k of dates){
    const sets = S.days[k].lifts?.[name];
    if(sets && sets.some(s=>s.w!==""||s.r!=="")){
      const best = sets.filter(s=>s.w!==""||s.r!=="").reduce((a,b)=>num(b.w)>num(a.w)?b:a);
      return {date:k, w:best.w, r:best.r};
    }
  }
  return null;
}
/* cardio sessions and conditioning circuits */
function specialCard(e, ei, D, week, num_){
  D.cardio = D.cardio || {};
  const key = `${ei}:${e.n}`, c = D.cardio[key] || {}, W = e.wk[week-1] || e.wk[0];
  if(e.type==="cardio"){
    const unit = e.unit === "min" ? "" : e.unit;
    return `<section class="ex cardio"><div class="exhead"><span class="exnum">${num_}</span><span class="exname">${esc(e.n)}</span><span class="tagpill">${esc(W.r)}</span></div>
      <div class="exnote">${esc(W.how)}</div>
      <div class="set${c.done?" is-done":""}" style="margin-left:36px;grid-template-columns:1fr 1fr 44px">
        <input inputmode="decimal" placeholder="Minutes" value="${esc(c.min||"")}" data-cx="${esc(key)}" data-k="min" aria-label="Minutes">
        ${unit?`<input inputmode="decimal" placeholder="${esc(unit==="m"?"Meters":unit==="yd"?"Yards":"Miles")}" value="${esc(c.dist||"")}" data-cx="${esc(key)}" data-k="dist" aria-label="Distance">`:`<span></span>`}
        <button class="done" data-cdone="${esc(key)}" data-def="${esc(String(W.r).replace(/\D.*$/,""))}" aria-pressed="${!!c.done}" aria-label="Mark ${esc(e.n)} done">✓</button>
      </div></section>`;
  }
  const scoreLbl = W.score==="time" ? "Time (min)" : W.score==="rounds" ? "Rounds" : "";
  return `<section class="ex circuit"><div class="exhead"><span class="exnum">${num_}</span><span class="exname">${esc(e.n)}</span><span class="tagpill">${esc(W.fmt)}</span></div>
    <div class="exnote">${esc(W.how)}</div>
    <ul class="moves">${W.moves.map(m=>{ const cue = CO ? CO.cues(m.n) : ""; return `<li><b>${esc(m.r)}</b> ${esc(m.n)}${cue?`<details class="cue" style="margin:2px 0 4px"><summary>Form tips</summary><ul>${cue.split(" · ").map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:""}</li>`; }).join("")}</ul>
    <div class="set${c.done?" is-done":""}" style="margin-left:36px;grid-template-columns:1fr 44px">
      ${scoreLbl?`<input inputmode="decimal" placeholder="${esc(scoreLbl)}" value="${esc(c.score||"")}" data-cx="${esc(key)}" data-k="score" aria-label="${esc(scoreLbl)}">`:`<span>All rounds done?</span>`}
      <button class="done" data-cdone="${esc(key)}" aria-pressed="${!!c.done}" aria-label="Mark circuit done">✓</button>
    </div>${c.best?`<p class="tip" style="margin-left:36px">${esc(c.best)}</p>`:""}</section>`;
}
document.addEventListener("input", e=>{ const k = e.target.dataset.cx; if(!k) return; const D = day(cur); D.cardio = D.cardio||{}; D.cardio[k] = D.cardio[k]||{}; D.cardio[k][e.target.dataset.k] = e.target.value.trim(); saveDay(cur); });
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-cdone]"); if(!t) return;
  const D = day(cur); D.cardio = D.cardio||{}; const c = D.cardio[t.dataset.cdone] = D.cardio[t.dataset.cdone]||{};
  c.done = !c.done;
  if(c.done && !c.min && t.dataset.def) c.min = t.dataset.def;
  if(c.done){ const m = cardioMeta(cur, t.dataset.cdone, {}); c.type = m.type; if(m.mod) c.mod = m.mod; if(m.unit) c.unit = m.unit; if(m.fmt) c.fmt = m.fmt; if(m.score) c.st = m.score; }
  if(c.done) celebrate(/^\d+:Conditioning/.test(t.dataset.cdone) ? "Circuit done. Nice work." : "Session logged. Nice work.", false);
  saveDay(cur); render();
});

/* ---------- shared profile + nutrition helpers ---------- */
function trainingDaysPerWeek(){
  if(S.plan && S.plan.days) return S.plan.mode==="recovery" ? 0 : S.plan.days.filter(d=>!d.rest).length;
  return S.nutri && S.nutri.a && S.nutri.a.workDays ? +S.nutri.a.workDays : 3;
}
function latestBody(){
  const ks = Object.keys(S.days).sort();
  const ws = weights(), a = avg7(ws, todayStr());
  const recent = ws.filter(x=>diff(todayStr(),x.d)<7).length;
  const pick = f => { for(let i=ks.length-1;i>=0;i--){ const v = num(S.days[ks[i]][f]); if(v>0) return v; } return null; };
  return {weight: recent>=3 ? a : (ws.length ? ws[ws.length-1].w : null), bf: pick("bf"), waist: pick("waist")};
}
function nutriInputs(){
  const a = {...S.nutri.a, ...S.profile};
  return a;
}
function nutriNow(onDate){
  if(!S.nutri || !N) return null;
  const b = latestBody(), n = S.nutri;
  return N.compute(nutriInputs(), {today:onDate||todayStr(), trainingDays:trainingDaysPerWeek(), weight:b.weight, bf:b.bf, waist:b.waist, adj:n.adj||0, cut:n.cut, ramp:n.ramp});
}
function isTrainingDay(d){
  if(!S.plan) return true;
  if(sickOn(d)==="rest") return false;
  const p = progInfo(d); if(p.before) return false;
  const dd = dayDef(p.dn); return dd && !dd.rest;
}
function todayTargets(){ return targetsOn(cur); }
// own = Adonis's own numbers, ignoring anything a coach has set
function targetsOn(d, own){
  const r = nutriNow(d), ct = own ? null : coachTargets();
  if(ct) return {cal:ct.cal, protein:ct.protein, carbs:ct.carbs, fat:ct.fat, r, coach:true};
  if(!r) return {cal:S.settings.cal, protein:S.settings.protein, carbs:S.settings.carbs, fat:S.settings.fat};
  const carbs = r.cycle && S.plan ? (isTrainingDay(d) ? r.carbsTrain : r.carbsRest) : r.carbs;
  return {cal: carbs===r.carbs ? r.cal : Math.round(r.protein*4 + carbs*4 + r.fat*9), protein:r.protein, carbs, fat:r.fat, r};
}

function planCard(){
  if(!S.plan) return "";
  return `<div class="plancard"><div class="t"><b>${esc(S.plan.title)}</b>Your custom plan</div><button class="linkbtn" id="ovw">Overview</button><button class="linkbtn" id="build">Rebuild</button></div>`;
}
function planLine(p){
  if(!S.plan) return "";
  return `<div class="planline"><span class="t"><b>${esc(S.plan.title)}</b></span><button class="linkbtn sm" id="ovw">Overview</button><button class="linkbtn sm" id="build">Rebuild</button></div>`;
}
function topRx(r){ return String(r).replace(/^.*-/,""); }   // "8-10" -> "10": what ✓ logs
function trainCrossCards(p){
  let h = "";
  const pregInPlan = S.plan && S.plan.answers && (S.plan.answers.around||[]).includes("pregnant");
  if(S.profile.status==="pregnant" && !pregInPlan && !(S.plan && S.plan.mode==="recovery"))
    h += `<div class="msg"><p>Your nutrition shows you're expecting. Rebuild your plan to get pregnancy-safe workouts.</p><div class="acts"><button class="linkbtn go" data-act="rebuild-preg">Rebuild my plan</button></div></div>`;
  if(p && !p.before && p.week===4 && p.dn>=5 && !S.blockSeen[p.cycle])
    h += `<div class="msg"><p><b>Your 4-week block is almost done.</b> What's next?</p><div class="acts"><button class="linkbtn" id="build">Build the next 4 weeks</button>${S.profile.status!=="pregnant"?`<button class="linkbtn go" data-act="start-cut">Start a cut</button>`:""}<button class="linkbtn" data-act="block-dismiss" data-cycle="${p.cycle}">Later</button></div></div>`;
  return h;
}
function planNotes(){
  if(!S.plan) return "";
  let h = "";
  if(S.plan.warning) h += `<div class="warn"><b>Stop and call your provider</b> ${esc(S.plan.warning.replace(/^Stop and call your OB or midwife if you notice /,"if you notice "))}</div>`;
  if(S.plan.notes && S.plan.notes.length) h += `<details class="notes"><summary>About this plan</summary><ul>${S.plan.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></details>`;
  return h;
}
function renderTrain(){
  if(!S.plan) return `<h2>Let's build your plan</h2><p class="sub">Answer a few quick questions and Adonis builds a 4-week plan around your goal, schedule, equipment and anything you need to work around.</p>
    <button class="primary" id="build" style="background:var(--protein);color:#fff">Build my plan</button>
    <p class="sub" style="margin-top:14px">Moving from another phone? Tap the person icon at the top and choose Restore from backup.</p>`;
  const p = progInfo(cur), D = day(cur);
  if(p.before) return planCard()+`<h2>Not started yet</h2><p class="sub">Your program starts ${esc(parse(S.settings.start).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))}. Change the start date on the Body tab.</p>`;
  const P = dayDef(p.dn);
  if(sickOn(cur)==="rest") return recapCard()+sickCard(cur)+tripsCard();
  if(P.rest){
    return recapCard()+planCard()+trainCrossCards(p)+`<p class="sub">Keep it easy. Tap what you did today.</p>
      <div class="chips" id="recov">${RECOVERY.map(r=>`<button class="chip" data-rec="${esc(r)}" aria-pressed="${D.recovery.includes(r)}">${esc(r)}</button>`).join("")}</div>`+tripsCard()+sickLink();
  }
  let n = 0;
  const cards = P.ex.map((e,ei)=>{
    if(e.type==="cardio" || e.type==="circuit"){ n++; return specialCard(e, ei, D, p.week, n); }
    if(e.pair!=="b" && !(e.tag && e.tag.endsWith("b"))) n++;
    const num_ = e.tag || (String(n) + (e.pair||""));
    const name = shown(e, D);
    const R = rx(e, p.week, cur);
    const sets = D.lifts[name] || [];
    while(sets.length < R.s) sets.push({w:"",r:"",done:false});
    D.lifts[name] = sets;
    const last = lastFor(name);
    const mode = S.plan ? S.plan.mode : "normal";
    const sug = CO && !e.amrap ? CO.suggest(name, sessionsFor(name, cur).slice(0,1), R.r, {mode}) : null;
    const hint = sug ? `<span class="sug">${esc(sug.text)}</span>` : last ? `Last time: ${last.w?esc(last.w)+" lb × ":""}${esc(last.r||"—")} reps` : "";
    const cue = CO ? CO.cues(name) : "";
    const swapped = name !== e.n, travel = isTravelSwap(e, D);
    const noFit = travel && !travelFor(cur)[e.n] ? "Nothing on this trip's equipment list matches. Add a set to another exercise, or skip this one" : "";
    const noteTxt = noFit || (swapped ? ((E && E.PF_NOTES[name]) || "") : (e.note || ""));
    const note = [esc(noteTxt), hint].filter(Boolean).join(". ");
    const bw = isBW(name, e);
    const lib = E && E.BY_NAME[name];
    const simple = lib && (lib.p==="pf" || lib.p==="pfwarm");
    const rows = simple ? sets.slice(0,R.s).map((s,i)=>`
      <div class="set${s.done?" is-done":""}" style="grid-template-columns:22px 1fr 44px">
        <span class="n">${i+1}</span><span>${esc(R.r)}</span>
        <button class="done" data-ex="${esc(name)}" data-orig="${esc(e.n)}" data-i="${i}" aria-pressed="${!!s.done}" aria-label="Mark ${esc(name)} done">✓</button>
      </div>`).join("") : sets.slice(0,R.s).map((s,i)=>`
      <div class="set${s.done?" is-done":""}">
        <span class="n">${i+1}</span>
        ${(()=>{ const wPre = (sets.slice(0,i).reverse().find(x=>x.w!=="")||{}).w || (sug && sug.w ? String(sug.w) : "");
          const amrap = e.amrap && !swapped, rPre = amrap ? "" : topRx(R.r);
          return `<input inputmode="decimal" class="${wPre?"pre":""}" placeholder="${esc(wPre || (bw?"BW":"lb"))}" value="${esc(s.w)}" data-ex="${esc(name)}" data-i="${i}" data-k="w" aria-label="${esc(name)} set ${i+1} weight">
        <span class="x">×</span>
        <input inputmode="numeric" class="${rPre?"pre":""}" placeholder="${esc(amrap?"max":rPre)}" value="${esc(s.r)}" data-ex="${esc(name)}" data-i="${i}" data-k="r" aria-label="${esc(name)} set ${i+1} reps">`; })()}
        <button class="done" data-ex="${esc(name)}" data-orig="${esc(e.n)}" data-i="${i}" data-sw="${sug && sug.w ? sug.w : ""}" aria-pressed="${!!s.done}" aria-label="Mark set ${i+1} done">${s.pr&&!isPregnant()?"PR":"✓"}</button>
      </div>`).join("");
    let sw = "";
    if(E){
      const ctx = S.plan ? S.plan.ctx : null;
      const others = P.ex.map(x=>shown(x,D));
      const easier = E.swap(name, -1, ctx, others), harder = E.swap(name, 1, ctx, others);
      const bits = [];
      if(easier) bits.push(`<button data-swap="${esc(e.n)}" data-to="${esc(easier)}" aria-label="Swap for an easier exercise: ${esc(easier)}">Swap: easier</button>`);
      if(harder) bits.push(`<button data-swap="${esc(e.n)}" data-to="${esc(harder)}" aria-label="Swap for a harder exercise: ${esc(harder)}">Swap: harder</button>`);
      if(swapped && travel) bits.push(`<button data-swap="${esc(e.n)}" data-to="${esc(e.n)}" data-keep="1">Use original</button><span class="was">Travel swap for ${esc(e.n)}</span>`);
      else if(swapped) bits.push(`<button data-swap="${esc(e.n)}" data-to="${esc(e.n)}">Undo</button><span class="was">Swapped from ${esc(e.n)}</span>`);
      if(bits.length) sw = `<div class="swaps">${bits.join("")}</div>`;
    }
    return `<section class="ex${(e.tag||e.pair)?" linked":""}">
      <div class="exhead"><span class="exnum">${esc(num_)}</span><span class="exname">${esc(name)}</span>${simple?"":`<span class="tagpill">${R.s} × ${esc(e.amrap&&!swapped?"max":R.r)}</span>`}</div>
      ${note?`<div class="exnote">${note}</div>`:""}
      ${cue||hasDemo(name)?`<details class="cue"><summary>How to do it</summary><div class="fdemo" data-demo="${esc(name)}" hidden></div>${cue?`<ul>${cue.split(" · ").map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}</details>`:""}
      <div class="sets">${rows}</div>${sw}</section>`;
  }).join("");

function totals(D){

}

/* ----- shared trend chart ----- */
function avgN(pts, d){ const w = pts.filter(p=>p.d<=d && diff(d,p.d)<7); return w.reduce((a,b)=>a+b.v,0)/w.length; }
function trendChart(pts, o={}){
  if(pts.length < 2) return `<div class="chart"><p class="empty">${esc(o.empty || "Log a few more entries to see a trend here.")}</p></div>`;
  pts = pts.slice(-120);
  const W=320, H=170, L=38, R=12, T=14, B=24, unit = o.unit || "";
  const t0 = pts[0].d; let tEnd = pts[pts.length-1].d;
  const g = o.goal && o.goal.v ? o.goal : null, gDated = g && g.d && g.d > tEnd ? g : null;
  if(gDated) tEnd = gDated.d;
  const ser = o.avg ? pts.map(p=>({d:p.d, v:avgN(pts,p.d)})) : pts;
  const vals = pts.map(p=>p.v).concat(g ? [g.v] : []);
  let mn = Math.min(...vals), mx = Math.max(...vals); const pv = Math.max((mx-mn)*0.12, o.minPad||1); mn -= pv; mx += pv;
  const span = Math.max(diff(tEnd,t0),1);
  const X = d => (L + (W-L-R)*(diff(d,t0)/span)).toFixed(1), Y = v => (H-B-(H-T-B)*((v-mn)/(mx-mn))).toFixed(1);
  const col = o.color || "var(--carbs)", txt = "font:11px var(--body);fill:var(--muted)";
  let s = `<text x="${L-6}" y="${T+4}" text-anchor="end" style="${txt}">${Math.round(mx)}</text><text x="${L-6}" y="${H-B}" text-anchor="end" style="${txt}">${Math.round(mn)}</text>`;
  s += `<text x="${L}" y="${H-6}" style="${txt}">${esc(sd(t0))}</text><text x="${W-R}" y="${H-6}" text-anchor="end" style="${txt}">${esc(sd(tEnd))}</text>`;
  s += `<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" style="stroke:var(--line)"/>`;
  if(g && !gDated) s += `<line x1="${L}" x2="${W-R}" y1="${Y(g.v)}" y2="${Y(g.v)}" style="stroke:var(--cal);stroke-width:1.5;stroke-dasharray:4 4"/>`;
  s += pts.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="${o.avg?2.6:3.2}" style="fill:${o.avg?"var(--muted)":col};opacity:${o.avg?.5:1}"/>`).join("");
  s += `<path d="${ser.map((p,i)=>`${i?"L":"M"}${X(p.d)},${Y(p.v)}`).join(" ")}" style="fill:none;stroke:${col};stroke-width:2.5;stroke-linejoin:round"/>`;
  if(gDated){ const last = ser[ser.length-1];
    s += `<path d="M${X(last.d)},${Y(last.v)} L${X(gDated.d)},${Y(gDated.v)}" style="fill:none;stroke:var(--cal);stroke-width:2;stroke-dasharray:5 4"/><circle cx="${X(gDated.d)}" cy="${Y(gDated.v)}" r="4.5" style="fill:var(--surface);stroke:var(--cal);stroke-width:2"/>`; }
  const leg = [o.avg?`<span><i class="sw" style="background:var(--muted);opacity:.55"></i>Daily</span><span><i class="sw" style="background:${col}"></i>7-day average</span>`:`<span><i class="sw" style="background:${col}"></i>${esc(o.label||"")}</span>`,
    g?`<span><i class="sw" style="background:var(--cal)"></i>Goal ${esc(r1(g.v))}${esc(unit)}${gDated?` by ${esc(sd(gDated.d))}`:""}</span>`:""].join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"Trend")} from ${esc(sd(t0))} to ${esc(sd(pts[pts.length-1].d))}">${s}</svg><div class="legend">${leg}</div></div>`;
}

function seriesOf(field){ return Object.keys(S.days).sort().filter(k=>num(S.days[k][field])>0).map(k=>({d:k, v:num(S.days[k][field])})); }
function paceText(){
  const s = S.settings, ws = weights(), t = todayStr();
  if(isPregnant()) return "Gaining weight is expected and healthy during pregnancy. Your Eat tab adjusts your calories as your baby grows.";
  if(ws.length < 2) return "Weigh in a few mornings a week and your pace shows up here.";
  const now = avg7(ws, t) ?? ws[ws.length-1].w, g = num(s.goalWeight), rem = g - now;
  if(g && Math.abs(rem) < 1) return `You're at your goal weight. ${num(s.goalBf) ? "From here, body fat and waist tell the story." : ""}`;
  const span = Math.min(28, diff(t, ws[0].d));
  if(span < 14) return "Keep weighing in. After two weeks of check-ins you'll see your pace here.";
  const then = avg7(ws, addDays(t, -span));
  if(then == null) return "Weigh in a little more often to see your pace.";
  const rate = (now - then) / (span/7), rt = `${rate>0?"+":""}${r1(rate)} lb a week`;
  if(!g) return `You're moving ${rt}. Set a goal weight below to see if you're on pace.`;
  if(Math.abs(rate) < 0.1 || Math.sign(rate) !== Math.sign(rem)) return `Your average is ${rt}, not toward ${g} lb yet. If you're building muscle while losing fat, the scale can hold steady while body fat and waist drop, so watch those too.`;
  const finish = addDays(t, Math.round(rem / rate * 7));
  if(!s.goalDate || s.goalDate <= t) return `At ${rt}, you'd reach ${g} lb around ${sd(finish)}.`;
  const off = Math.round(diff(finish, s.goalDate) / 7);
  if(Math.abs(off) <= 1) return `At ${rt}, you're on pace to reach ${g} lb by ${sd(s.goalDate)}.`;
  return off > 0 ? `At ${rt}, you'd reach ${g} lb around ${sd(finish)}, about ${off} weeks after your goal date.` : `At ${rt}, you'd reach ${g} lb around ${sd(finish)}, about ${-off} weeks ahead of schedule.`;

function slopePerDay(pts){
  const t = todayStr(), w = pts.filter(p=>diff(t,p.d) <= 42);
  if(w.length < 3 || diff(w[w.length-1].d, w[0].d) < 14) return null;
  const xs = w.map(p=>diff(p.d, w[0].d)), mx = xs.reduce((a,b)=>a+b,0)/xs.length, my = w.reduce((a,b)=>a+b.v,0)/w.length;
  const num_ = xs.reduce((a,x,i)=>a+(x-mx)*(w[i].v-my),0), den = xs.reduce((a,x)=>a+(x-mx)**2,0);
  return den ? {slope:num_/den, at: my + (num_/den)*(diff(t, w[0].d)-mx)} : null;

// lean mass vs fat mass: body fat % times the weight around that day. Shows whether weight change is muscle or fat.
function leanMassSection(bf){

    return w ? {d:p.d, lean:w*(1-p.v/100), fat:w*p.v/100} : null; }).filter(Boolean);
  if(!pts.length) return "";
  const a = pts[0], z = pts[pts.length-1], sg = v => (v>0?"+":"")+r1(v);
  let h = `<h2>Lean mass</h2>${trendChart(pts.map(p=>({d:p.d, v:Math.round(p.lean*10)/10})), {unit:" lb", minPad:1, label:"Lean mass (lb)", color:"var(--protein)", aria:"Lean mass trend", empty:"Weigh in and measure body fat for two weeks to see your lean mass trend."})}
    <div class="stats" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat"><b>${r1(z.lean)} lb</b><span>Lean mass${pts.length>1?` · ${sg(z.lean-a.lean)} since ${esc(sd(a.d))}`:""}</span></div>
      <div class="stat"><b>${r1(z.fat)} lb</b><span>Fat mass${pts.length>1?` · ${sg(z.fat-a.fat)} since ${esc(sd(a.d))}`:""}</span></div></div>`;
  return h + `<p class="tip statnote">Lean mass is everything that isn't fat: muscle, bone, water. If it holds or climbs while fat mass drops, you're building or keeping muscle, even when the scale barely moves.</p>`;
}
/* ----- strength goals: a short list of benchmarks, not every exercise (every lift still tracks its own records) ----- */
const SG_BENCH = [
  {g:"Big lifts", kind:"lift", items:[["Barbell Bench Press","Bench press"],["Barbell Back Squat","Back squat"],["Barbell Deadlift","Deadlift"],["Barbell Overhead Press","Overhead press"]]},
  {g:"Bodyweight", kind:"reps", items:[["Pull Up","Pull-ups"],["Chin Up","Chin-ups"],["Push Up","Push-ups"],["Dips","Dips"]]},
  {g:"Running", kind:"run", items:[["run:1","1 mile"],["run:2","2 miles"],["run:3.107","5K"],["run:6.214","10K"]]},
];
function sgFind(id){ for(const b of SG_BENCH){ const it = b.items.find(i=>i[0]===id); if(it) return {kind:b.kind, id, label:it[1]}; } return null; }
const sgKind = g => g.kind || (g.w > 0 ? "lift" : "reps");
const sgLabel = g => g.label || g.n;
// "7:45" -> 465 s, "1:02:30" -> 3750 s, "8" -> 480 s (plain number = minutes)
function parseTime(v){
  v = String(v||"").trim(); if(!v) return 0;
  if(!v.includes(":")) return Math.round(num(v)*60);
  const p = v.split(":").map(x=>num(x)); if(p.some(x=>x<0) || p.slice(1).some(x=>x>=60)) return 0;
  return Math.round(p.reduce((a,x)=>a*60+x, 0));
}
function fmtTime(sec){ sec = Math.round(sec); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), x = sec%60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; }
// one value per day: estimated max / reps (higher is better) or run time in seconds (lower is better)
function goalPts(g){
  const kind = sgKind(g), by = {};
  const put = (d, v, better) => { if(v > 0 && (by[d] == null || better(v, by[d]))) by[d] = v; };
  if(kind === "run"){
    const lower = (a,b) => a < b;
    // plan runs at least as long as the goal distance count, at their average pace
    Object.keys(S.days).forEach(k=>Object.entries(S.days[k].cardio||{}).forEach(([key,c])=>{
      const m = cardioMeta(k, key, c), dist = num(c.dist), mins = num(c.min);
      if(m.mod === "run" && (m.unit || "mi") === "mi" && dist >= g.dist && mins > 0) put(k, Math.round(mins*60*g.dist/dist), lower);
    }));
    (g.tests||[]).forEach(t=>put(t.d, t.sec, lower));
  } else {
    const metric = x => gMetric(g, x), higher = (a,b) => a > b;
    dailyBest(g.n, metric).forEach(p=>put(p.d, p.v, higher));
    (g.tests||[]).forEach(t=>put(t.d, Math.round(metric(t)), higher));
  }
  return Object.keys(by).sort().map(d=>({d, v:by[d]}));
}
function goalHit(g, pts){
  if(sgKind(g) === "run") return ((pts || goalPts(g)).find(p=>p.v <= g.sec) || {}).d || null;
  const ok = s => (g.w > 0 ? num(s.w) >= g.w : true) && num(s.r) >= g.r;
  let hit = null;
  Object.keys(S.days).sort().some(k=>(S.days[k].lifts?.[g.n]||[]).some(s=>ok(s) && (hit = k)));
  (g.tests||[]).forEach(t=>{ if(ok(t) && (!hit || t.d < hit)) hit = t.d; });
  return hit;
}
function goalTitle(g){
  const kind = sgKind(g);
  if(kind === "run") return `${sgLabel(g)} in ${fmtTime(g.sec)}`;
  return `${sgLabel(g)}: ${kind === "lift" ? `${g.w} lb${g.r>1?` for ${g.r} reps`:""}` : `${g.r} reps in one set`}`;
}
function goalCard(g){
  const kind = sgKind(g), run = kind === "run", pts = goalPts(g);
  const target = run ? g.sec : kind === "lift" ? CO.e1rm(g.w, g.r) : g.r;
  const best = pts.length ? (run ? Math.min(...pts.map(p=>p.v)) : Math.max(...pts.map(p=>p.v))) : 0;
  const hit = goalHit(g, pts);
  const pct = hit ? 100 : !best ? 0 : Math.min(99, Math.round(100*(run ? target/best : best/target)));
  let line;
  if(hit) line = `Done on ${sd(hit)}. Time for a new goal?`;
  else if(!pts.length) line = run ? "Log a timed run and your progress shows up here." : "Log it in a workout, or log a test, and your progress shows up here.";
  else {
    const sl = slopePerDay(pts), byTxt = g.by ? ` your ${sd(g.by)} goal date` : "";
    const short = Math.max(1, Math.round(target - best));
    const now = kind === "lift" ? `Your best sets put you about ${short} lb short.` : run ? `Best so far: ${fmtTime(best)}, ${fmtTime(best - g.sec)} to go.` : `Best so far: ${best} reps.`;
    const improving = sl && (run ? sl.slope < 0 : sl.slope > 0);
    if(!improving) line = `${now} ${sl ? "Not trending " + (run ? "faster" : "up") + " yet." + (cutting() && !run ? " That's normal during a cut." : " Keep pushing.") : "Keep logging and a finish date shows up here."}`;
    else { const days = Math.max(0, Math.round((target - sl.at)/sl.slope)), eta = addDays(todayStr(), days);
      line = `${now} At your current pace, around ${sd(eta)}${g.by ? (eta <= g.by ? `, ahead of${byTxt}` : `, after${byTxt}`) : ""}.`; }
  }
  return `<div class="card sgoal"><div class="rh"><b>${esc(goalTitle(g))}</b><button class="xbtn" data-sgdel="${esc(g.id)}" aria-label="Remove goal ${esc(sgLabel(g))}">✕</button></div>
    <div class="gbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%;${hit?"background:var(--protein)":""}"></i></div>
    <p class="tip" style="margin:0">${esc(line)}${g.by && !hit ? ` Goal date: ${esc(sd(g.by))}.` : ""}</p>
    ${hit ? "" : `<button class="linkbtn" data-sgtest="${esc(g.id)}" style="margin-top:10px">Log a test</button>`}</div>`;
}
function goalFields(id){
  const b = sgFind(id); if(!b) return "";
  let h = "", hint = "";
  if(b.kind === "lift"){
    let top = null;   // heaviest-feeling set logged: the one with the highest estimated max
    Object.values(S.days).forEach(D=>(D.lifts?.[id]||[]).forEach(x=>{ if(num(x.w)>0 && num(x.r)>0 && (!top || CO.e1rm(num(x.w),num(x.r)) > CO.e1rm(num(top.w),num(top.r)))) top = x; }));
    h = `<div class="field" style="grid-column:span 2"><label for="sg-w">Weight lb</label><input id="sg-w" inputmode="decimal" placeholder="225"></div>
      <div class="field" style="grid-column:span 2"><label for="sg-r">Reps</label><input id="sg-r" inputmode="numeric" value="1"></div>`;
    if(top) hint = `Your best set so far: ${num(top.w)} lb × ${num(top.r)}.`;
  } else if(b.kind === "reps"){
    const pts = dailyBest(id, x=>num(x.w)>0 ? 0 : num(x.r));
    h = `<div class="field wide"><label for="sg-r">Reps in one set</label><input id="sg-r" inputmode="numeric" placeholder="15"></div>`;
    if(pts.length) hint = `Your best so far: ${Math.max(...pts.map(p=>p.v))} reps.`;
  } else {
    h = `<div class="field wide"><label for="sg-t">Time to beat</label><input id="sg-t" inputmode="text" placeholder="${id==="run:1"?"8:00":id==="run:2"?"17:00":id==="run:3.107"?"27:00":"58:00"}"><p class="tip">Minutes and seconds, like 7:45. Over an hour? Use 1:02:30.</p></div>`;
  }
  return h + (hint ? `<p class="tip" style="grid-column:1/-1;margin:0">${esc(hint)}</p>` : "");
}
function goalForm(){

// a test: a one-off attempt logged straight on the goal (a run time trial, a max set of push-ups, a heavy single)
function testForm(g){

/* log or un-log one set (list view and workout mode share this) */
function toggleSet(D, name, orig, i, sw){
  const s = D.lifts[name][i];
  s.done = !s.done;
  const pi=progInfo(cur), P=dayDef(pi.dn), ex=P.ex.find(x=>x.n===orig);
  if(s.done){
    if(s.r===""){ if(ex && !(ex.amrap && name===ex.n)){ s.r=topRx(rx(ex,pi.week).r); } }
    if(s.w===""){ // carry the weight from the set before (most people repeat it), else today's suggestion
      const prevW = D.lifts[name].slice(0, i).reverse().find(x=>x.w!=="");
      if(prevW) s.w = prevW.w; else if(sw) s.w = String(sw);
    }
    if(ex){ D.rx = D.rx || {}; D.rx[name] = String(rx(ex,pi.week).r); }
    // personal record? (needs a previous best to beat)
    const prev = bestE1(name, cur), today = Math.max(0, ...D.lifts[name].filter(x=>x!==s).map(x=>CO.e1rm(num(x.w), num(x.r))));
    const mine = CO.e1rm(num(s.w), num(s.r));
    if(!isPregnant() && prev > 0 && mine > prev && mine > today){ D.lifts[name].forEach(x=>delete x.pr); s.pr = true; celebrate(`New record: ${name}, ${s.w} lb × ${s.r}`, true); }
    const lib = E && E.BY_NAME[name];
    if(!(lib && lib.p==="pfwarm")) startRest(CO.restFor(name, S.plan && S.plan.answers ? S.plan.answers.goal : "muscle", S.plan ? S.plan.mode : "normal"));
  } else { delete s.pr; }
}

function initCarousel(){
  const car = $("#mcar"); if(!car) return;

  go(MEALPOS.i, false);
  let t = null;
  car.addEventListener("scroll", ()=>{
    clearTimeout(t);
    t = setTimeout(()=>{
      const i = Math.round(car.scrollLeft / car.clientWidth);

      dots.forEach((d,k)=>d.setAttribute("aria-selected", k===MEALPOS.i));
    }, 60);
  }, {passive:true});
  const pick = i => { MEALPOS.i = i; go(i, true); dots.forEach((x,k)=>x.setAttribute("aria-selected", k===i)); };
  dots.forEach(d=>d.addEventListener("click", ()=>pick(+d.dataset.dot)));
