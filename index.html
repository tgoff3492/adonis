<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adonis</title>
<meta name="theme-color" content="#ECEEEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A2535" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Adonis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --ink:#1F2D41; --muted:#5E6A78; --line:#D3D8D1; --field:#F5F6F3;
  --protein:#C23B2E; --carbs:#2766B0; --fat:#C99414; --cal:#2E8B57; --focus:#2766B0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A2535; --surface:#233042; --ink:#E7EAE4; --muted:#95A1AE; --line:#334256; --field:#2B394C;
    --protein:#E0604F; --carbs:#5B94DA; --fat:#E2B43A; --cal:#4DB07A; --focus:#7FB0EC;
  }
}
:root[data-theme="dark"]{
  --bg:#1A2535; --surface:#233042; --ink:#E7EAE4; --muted:#95A1AE; --line:#334256; --field:#2B394C;
  --protein:#E0604F; --carbs:#5B94DA; --fat:#E2B43A; --cal:#4DB07A; --focus:#7FB0EC;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.datebar{display:flex;align-items:center;gap:8px}
.datebar h1{flex:1;margin:0;font:700 30px/1 var(--display);letter-spacing:.01em}
.datebar h1 small{display:block;font:500 15px/1.3 var(--body);color:var(--muted);margin-top:4px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:18px}
.todaybtn{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.status{font-size:13px;color:var(--muted);margin-top:6px;min-height:18px}

h2{font:700 24px/1.1 var(--display);margin:22px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.ex.linked{border-left:4px solid var(--carbs)}
.exhead{display:flex;align-items:baseline;gap:10px}
.exnum{font:700 18px var(--display);color:var(--muted);min-width:26px}
.exname{font:600 20px/1.15 var(--display);flex:1}
.exnote{font-size:13px;color:var(--muted);margin:2px 0 8px 36px}
.sets{display:grid;gap:6px;margin-left:36px}
.set{display:grid;grid-template-columns:22px 1fr 14px 1fr 44px;align-items:center;gap:6px}
.set .n{font:600 15px var(--display);color:var(--muted)}
.set .x{color:var(--muted);text-align:center}
.set input,.field input{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);font-variant-numeric:tabular-nums}
.done{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-size:18px;color:var(--muted)}
.set.is-done .done{background:var(--cal);border-color:var(--cal);color:#fff}
.set.is-done input{opacity:.7}
.primary{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:700 19px var(--display);letter-spacing:.02em;cursor:pointer;margin-top:14px}
.primary.ok{background:var(--cal);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px 14px;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.plates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 6px}
.plate{text-align:center}
.plate svg{width:100%;max-width:112px;display:block;margin:0 auto}
.plate .val{font:700 22px/1 var(--display)}
.plate .lbl{font-size:13px;color:var(--muted);margin-top:4px}
.plate .left{font-size:12px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field.wide{grid-column:1/-1}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .nm{flex:1;min-width:0}
.entry .nm b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .mac{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px;width:36px;height:36px;border-radius:50%}
.empty{color:var(--muted);margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font:700 26px/1 var(--display)}
.stat span{font-size:13px;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.chart svg{width:100%;display:block}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px;margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:14px 0;cursor:pointer;font:600 18px var(--display);color:var(--muted);border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.plate circle.fill{transition:stroke-dashoffset .5s ease}}

/* ---------- plan + builder ---------- */
.plancard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0 4px;display:flex;align-items:center;gap:10px}
.plancard .t{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.plancard .t b{display:block;color:var(--ink);font:600 17px/1.2 var(--display)}
.linkbtn{border:1px solid var(--line);background:var(--field);border-radius:20px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.linkbtn.go{background:var(--protein);border-color:var(--protein);color:#fff}
.warn{border:1px solid var(--protein);border-left:4px solid var(--protein);border-radius:0;background:var(--surface);padding:10px 12px;margin:10px 0;font-size:14px}
.warn b{color:var(--protein)}
details.notes{margin:8px 0 0;font-size:14px;color:var(--muted)}
details.notes summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.notes ul{margin:6px 0 0;padding-left:18px}
.swaps{display:flex;gap:6px;margin-left:36px;margin-top:8px;flex-wrap:wrap;align-items:center}
.swaps button{border:1px solid var(--line);background:var(--field);border-radius:16px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.swaps .was{font-size:12px;color:var(--muted)}
#builder{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#builder .in{max-width:560px;margin:0 auto;padding:16px 16px 120px}
#builder .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#builder .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
#builder .bar i{display:block;height:100%;background:var(--protein);transition:width .25s}
#builder h2{font:700 28px/1.1 var(--display);margin:18px 0 6px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font:500 17px/1.3 var(--body)}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.opt .box{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex:none;display:grid;place-items:center;font-size:14px;color:#fff}
.opt.single .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink)}
.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bnav .in2{max-width:560px;margin:0 auto;display:flex;gap:10px}
.bnav button{flex:1;padding:14px;border-radius:10px;font:700 19px var(--display);cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.bnav button.next{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bnav button:disabled{opacity:.4;cursor:default}
.pday{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.pday b{font:600 18px var(--display)}
.pday ol{margin:6px 0 0;padding-left:20px;font-size:15px}
.pday .rest{color:var(--muted);font-size:14px}
.err{color:var(--protein);font-size:14px;min-height:20px;margin-top:8px}

.msg{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cal);border-radius:0;padding:12px 14px;margin:12px 0}
.msg.adj{border-left-color:var(--carbs)}
.msg p{margin:0 0 10px}
.msg .acts{display:flex;gap:8px;flex-wrap:wrap}
.nsum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0 4px}
.nsum .k{font-size:13px;color:var(--muted)}
.nsum .big{font:700 34px/1 var(--display)}
.nsum .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.flds .field input{font-size:18px;padding:12px}
.flds .wide{grid-column:1/-1}
.tip{font-size:13px;color:var(--muted);margin-top:4px}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

.meal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.meal .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meal .nm{font:600 20px/1.15 var(--display);margin:2px 0}
.meal .mac{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.meal details{margin-top:6px;font-size:14px}
.meal details summary{cursor:pointer;color:var(--ink);font-weight:600}
.meal .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mcar{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;align-items:flex-start;margin:0 -16px;padding:0 16px;scroll-padding:0 16px}
.mcar::-webkit-scrollbar{display:none}
.mcar .meal{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;margin-bottom:0}
.dots{display:flex;justify-content:center;gap:4px;margin:10px 0 4px}
.dots .dot{width:28px;height:28px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.dots .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);transition:width .2s,background .2s}
.dots .dot[aria-selected="true"]::after{width:22px;border-radius:4px;background:var(--ink)}
.meal .mtag{font-size:13px;color:var(--protein);font-weight:600;margin:2px 0 2px}
.meal ol.steps{margin:8px 0 0;padding-left:22px;font-size:15px;line-height:1.5}
.meal ol.steps li{margin:0 0 8px}
.meal .xtra{font-size:14px;margin:6px 0 0;padding:8px 10px;background:var(--field);border-radius:8px}
.prepnote{background:var(--field);border-left:3px solid var(--blue);border-radius:8px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.prepsteps{margin:0;padding-left:22px;font-size:15px;line-height:1.5}
.prepsteps li{margin:0 0 10px}
.meal .linkbtn.done{background:var(--cal);border-color:var(--cal);color:#fff}
.mtools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.glist label{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.glist label:first-of-type{border-top:0}
.glist input{width:20px;height:20px;flex:none}
.glist .amt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.glist label.got span:first-of-type{text-decoration:line-through;color:var(--muted)}

#scanner{position:fixed;inset:0;z-index:60;background:#000;color:#fff}
#scanvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanframe{position:absolute;left:10%;right:10%;top:32%;height:22%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.scantop{position:absolute;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:12px;font:600 17px var(--body)}
.scantop .iconbtn{background:rgba(255,255,255,.15);border-color:transparent;color:#fff}
.scanbottom{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.7)}
.scanbottom label{font-size:14px;display:block;margin-bottom:6px}
.row2{display:flex;gap:8px}
.row2 input{flex:1;min-width:0;padding:12px;border-radius:8px;border:0;font-size:18px;background:#fff;color:#111}
.food{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.food .brand{font-size:13px;color:var(--muted)}
.food .fn{font:600 22px/1.15 var(--display);margin:2px 0 8px}
.stepper{display:flex;align-items:center;gap:10px;margin:10px 0}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--field);font-size:22px;cursor:pointer}
.stepper input{width:80px;text-align:center;font-size:20px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--field)}

.fsearch{display:flex;gap:8px;margin:0 0 10px}
.fsearch input{flex:1;min-width:0;padding:13px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:17px}
.fsearch .linkbtn{padding:0 18px;font-size:16px}
.fres{padding:4px 14px;margin-bottom:12px}
.left{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin:0 0 10px;font-size:14px;color:var(--muted)}
.left b{color:var(--ink);font-variant-numeric:tabular-nums}
.left .lp b{color:var(--protein)} .left .lc b{color:var(--carbs)} .left .lf b{color:var(--fat)}
.left .ok{color:var(--cal)} .left.done{color:var(--cal);font-weight:600}
.qa .qah{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.qa .qah b{font:700 20px/1.1 var(--display)}
.qa #fcal{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--muted)}
.qarow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.qm{display:flex;flex-direction:column;background:var(--field);border:1px solid var(--line);border-top:3px solid var(--qc,var(--line));border-radius:10px;padding:8px 10px 6px;position:relative;cursor:text}
.qm span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.qm input{border:0;background:none;padding:2px 18px 0 0;font:700 26px/1.1 var(--display);width:100%;min-width:0;color:var(--ink)}
.qm input:focus{outline:none}
.qm input::placeholder{color:var(--muted);opacity:.4}
.qm:focus-within{border-color:var(--qc);box-shadow:0 0 0 2px color-mix(in srgb,var(--qc) 25%,transparent)}
.qm i{position:absolute;right:10px;bottom:9px;font-style:normal;color:var(--muted);font-size:14px}
.qp{--qc:var(--protein)} .qc{--qc:var(--carbs)} .qf{--qc:var(--fat)}
.qa .row2{display:flex;gap:8px}
.qa .row2 input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:16px}
.qa .row2 .primary{width:auto;margin:0;padding:0 22px}
.frow .plus{width:32px;height:32px;border-radius:50%;background:var(--field);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;line-height:1;color:var(--ink);flex:none}
.fres button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;cursor:pointer}
.fres button:first-child{border-top:0}
.fres .nm2{flex:1;min-width:0}
.fres .nm2 b{display:block;font-weight:600}
.fres .nm2 span{font-size:13px;color:var(--muted)}
.fres .cal{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}

.exnote .sug{color:var(--ink);font-weight:600}
details.cue{margin:0 0 8px 36px;font-size:14px}
details.cue summary{cursor:pointer;color:var(--carbs);font-weight:600}
details.cue ul{margin:6px 0 0;padding-left:18px;color:var(--ink)}
/* ---------- today ---------- */
.hero{margin:14px 0 12px;padding:18px 16px 16px;border-radius:14px;background:var(--ink);color:var(--bg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:0;bottom:0;width:120px;background:repeating-linear-gradient(115deg,var(--protein) 0 14px,transparent 14px 28px);opacity:.9}
.hero .kick{font:700 14px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--protein);position:relative;z-index:1}
.hero .hl{font:800 42px/0.98 var(--display);font-style:italic;text-transform:uppercase;margin:4px 0 6px;max-width:78%;position:relative;z-index:1}
.hero .tag{margin:0;font-size:15px;opacity:.82;max-width:74%;position:relative;z-index:1}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.tcard .th{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.tcard .th b{font:700 20px/1.1 var(--display);flex:1}
.tcard .th span{font-size:13px;color:var(--muted)}
.tcard p{margin:0 0 10px;color:var(--muted);font-size:15px}
.tcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.tcard .primary{margin-top:4px}
.meter{margin:8px 0}
.meter .ml{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.meter .ml b{font-weight:600}
.meter .mb{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter .mb i{display:block;height:100%;border-radius:5px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 10px}
.wk div{text-align:center;font-size:12px;color:var(--muted)}
.wk i{display:block;margin:4px auto 0;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);font-style:normal;line-height:26px;font-size:14px;color:#fff}
.wk .plan i{border-color:var(--ink)}
.wk .did i{background:var(--cal);border-color:var(--cal)}
.wk .miss i{border-style:dashed}
.wk .now{color:var(--ink);font-weight:700}

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </header>
  <main id="main"></main>
</div>
<section id="builder" hidden aria-label="Build my plan"></section>
<section id="scanner" hidden aria-label="Barcode scanner">
  <video id="scanvid" playsinline muted autoplay></video>
  <div class="scanframe" aria-hidden="true"></div>
  <div class="scantop"><button class="iconbtn" id="scanclose" aria-label="Close scanner">✕</button><span id="scanmsg" role="status">Point your camera at the barcode</span></div>
  <form class="scanbottom" id="scantype"><label for="scancode">Or type the number under the barcode</label><div class="row2"><input id="scancode" inputmode="numeric" autocomplete="off" placeholder="e.g. 049000028911"><button class="linkbtn go" type="submit">Look up</button></div>
  <p class="tip" style="color:#c9d1db">Looks up the number in Open Food Facts, a free public food database. Nothing else leaves your phone.</p></form>
</section>
<section id="focus" hidden aria-label="Workout mode"></section>
<div id="rest" hidden role="timer" aria-live="off"></div>
<div id="toast" hidden role="status"></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<nav class="tabs" aria-label="Sections"><div class="in" role="tablist">
  <button role="tab" data-tab="today" aria-selected="true">Today</button>
  <button role="tab" data-tab="train" aria-selected="false">Train</button>
  <button role="tab" data-tab="eat" aria-selected="false">Eat</button>
  <button role="tab" data-tab="body" aria-selected="false">Body</button>
</div></nav>

<script src="engine.js"></script>
<script src="nutrition.js"></script>
<script src="meals.js"></script>
<script src="foods.js"></script>
<script src="coach.js"></script>
<script src="demos.js"></script>
<script>
const DEFAULTS = {start:todayStr(), cal:2400, protein:175, carbs:265, fat:70, goalWeight:"", goalBf:"", goalDate:""};
const RECOVERY = ["Walking","Yoga","Stretching","Mobility","Hiking","Foam rolling","Biking"];

/* ---------- state ---------- */
let S = {settings:{...DEFAULTS}, days:{}, plan:null, profile:{}, nutri:null, blockSeen:{}, mealplan:null, foods:{}, recapSeen:{}, sgoals:[]};
const MP = window.AdonisMeals;
const N = window.AdonisNutrition;
const E = window.AdonisEngine;
let cur = todayStr();
let tab = "today";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function pad(n){return String(n).padStart(2,"0")}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function fmt(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function diff(a,b){return Math.round((parse(a)-parse(b))/864e5)}
function num(v){const n=parseFloat(v);return isFinite(n)?n:0}

function day(d){
  if(!S.days[d]) S.days[d] = {date:d, food:[], lifts:{}, weight:"", bf:"", recovery:[], complete:false};
  return S.days[d];
}
function progInfo(d){
  const idx = diff(d, S.settings.start);
  if(idx < 0) return {before:true, inDays:-idx};
  return {cycle:Math.floor(idx/28)+1, week:Math.floor((idx%28)/7)+1, dn:idx%7+1};
}

function dayDef(dn){ return S.plan ? S.plan.days[dn-1] : null; }
function weekNote(w){ return S.plan ? S.plan.weekNotes[w-1] : ""; }
function rx(e, w){ return e.wk ? e.wk[w-1] : {s:3, r:"10"}; }
function shown(e, D){ return (D.swap && D.swap[e.n]) || e.n; }
function isBW(name, e){ const x = E && E.BY_NAME[name]; return x ? (x.eq.length===0 && x.p!=="cond") : !!e.bw; }

/* ---------- storage ---------- */
function cacheLocal(){try{localStorage.setItem("adonis-v1", JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem("adonis-v1");if(r){const o=JSON.parse(r);S={settings:{...DEFAULTS,...o.settings},days:o.days||{},plan:o.plan||null,profile:o.profile||{},nutri:o.nutri||null,blockSeen:o.blockSeen||{},mealplan:o.mealplan||null,foods:o.foods||{},recapSeen:o.recapSeen||{},sgoals:o.sgoals||[]}}}catch(e){}}
function setStatus(t){$("#status").textContent=t}
const timers = {};
function saveDay(d){
  try{ checkMacroWins(d); }catch(e){}
  clearTimeout(timers[d]);
  timers[d] = setTimeout(()=>{cacheLocal();setStatus("Saved")},300);
}
function saveSettings(){
  clearTimeout(timers.settings);
  timers.settings = setTimeout(()=>{cacheLocal();setStatus("Saved")},300);
}

/* ---------- backup ---------- */
function markBackup(){ S.settings.lastBackup = todayStr(); S.settings.backupSnooze = ""; cacheLocal(); render(); }
function backupBanner(){
  const logged = Object.keys(S.days).length;
  if(logged < 3) return "";
  const last = S.settings.lastBackup, sn = S.settings.backupSnooze;
  if(sn && diff(todayStr(), sn) < 3) return "";
  const days = last ? diff(todayStr(), last) : null;
  if(days !== null && days < 14) return "";
  return `<div class="msg adj"><p>${days===null ? "You haven't backed up yet." : `It's been ${days} days since your last backup.`} Your logs live only on this phone, so a backup keeps them safe.</p><div class="acts"><button class="linkbtn go" id="export">Save backup</button><button class="linkbtn" data-act="backup-later">Later</button></div></div>`;
}
async function exportData(){
  const name = `adonis-backup-${todayStr()}.json`;
  const blob = new Blob([JSON.stringify({app:"adonis",version:1,exported:new Date().toISOString(),...S},null,1)],{type:"application/json"});
  try{
    const file = new File([blob], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Adonis backup"});
      markBackup(); setStatus("Backup saved"); return;
    }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  markBackup(); setStatus("Backup downloaded");
}
async function importData(file){
  try{
    const o = JSON.parse(await file.text());
    if(!o || typeof o!=="object" || !o.days) throw new Error("bad");
    const n = Object.keys(o.days).length;
    if(!confirm(`Restore this backup (${n} logged day${n===1?"":"s"})? Days in the backup replace the same days on this phone.`)) return;
    S.settings = {...DEFAULTS, ...S.settings, ...(o.settings||{})};
    for(const d in o.days) S.days[d] = o.days[d];
    if(o.plan) S.plan = o.plan;
    if(o.profile) S.profile = {...S.profile, ...o.profile};
    if(o.nutri) S.nutri = o.nutri;
    if(o.mealplan) S.mealplan = o.mealplan;
    if(o.foods) S.foods = {...(S.foods||{}), ...o.foods};
    if(Array.isArray(o.sgoals)) S.sgoals = o.sgoals;
    cacheLocal(); render(); setStatus("Backup restored");
  }catch(e){ setStatus("That file isn't an Adonis backup.") }
}

/* ---------- header ---------- */
function renderHeader(){
  const d = parse(cur), t = todayStr();
  const label = cur===t ? "Today" : cur===addDays(t,-1) ? "Yesterday" : cur===addDays(t,1) ? "Tomorrow"
    : d.toLocaleDateString(undefined,{weekday:"long"});
  const p = progInfo(cur);
  let sub = d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  if(p.before) sub += `. Program starts in ${p.inDays} day${p.inDays>1?"s":""}.`;
  else if(S.plan) sub += `. ${p.cycle>1?`Round ${p.cycle}, w`:"W"}eek ${p.week}, day ${p.dn}: ${dayDef(p.dn).name}`;
  $("#dtitle").innerHTML = `${esc(label)}<small>${esc(sub)}</small>`;
  $("#today").hidden = cur===t;
}

/* ---------- train ---------- */
const CO = window.AdonisCoach;
function sessionsFor(name, before){
  // newest first: each is the list of sets with reps logged, tagged with that day's rep target
  const out = [];
  Object.keys(S.days).filter(k=>k<before).sort().reverse().forEach(k=>{
    const sets = S.days[k].lifts?.[name];
    if(sets && sets.some(s=>num(s.r)>0)){ const a = sets.filter(s=>num(s.r)>0); a.rx = S.days[k].rx?.[name] || null; out.push(a); }
  });
  return out;
}
function bestE1(name, before){
  let b = 0;
  Object.keys(S.days).filter(k=>k<before).forEach(k=>{ (S.days[k].lifts?.[name]||[]).forEach(s=>{ b = Math.max(b, CO.e1rm(num(s.w), num(s.r))); }); });
  return b;
}
function lastFor(name){
  const dates = Object.keys(S.days).filter(k=>k<cur).sort().reverse();
  for(const k of dates){
    const sets = S.days[k].lifts?.[name];
    if(sets && sets.some(s=>s.w!==""||s.r!=="")){
      const best = sets.filter(s=>s.w!==""||s.r!=="").reduce((a,b)=>num(b.w)>num(a.w)?b:a);
      return {date:k, w:best.w, r:best.r};
    }
  }
  return null;
}
/* cardio sessions and conditioning circuits */
function specialCard(e, ei, D, week, num_){
  D.cardio = D.cardio || {};
  const key = `${ei}:${e.n}`, c = D.cardio[key] || {}, W = e.wk[week-1] || e.wk[0];
  if(e.type==="cardio"){
    const unit = e.unit === "min" ? "" : e.unit;
    return `<section class="ex cardio"><div class="exhead"><span class="exnum">${num_}</span><span class="exname">${esc(e.n)}</span><span class="tagpill">${esc(W.r)}</span></div>
      <div class="exnote">${esc(W.how)}</div>
      <div class="set${c.done?" is-done":""}" style="margin-left:36px;grid-template-columns:1fr 1fr 44px">
        <input inputmode="decimal" placeholder="Minutes" value="${esc(c.min||"")}" data-cx="${esc(key)}" data-k="min" aria-label="Minutes">
        ${unit?`<input inputmode="decimal" placeholder="${esc(unit==="m"?"Meters":unit==="yd"?"Yards":"Miles")}" value="${esc(c.dist||"")}" data-cx="${esc(key)}" data-k="dist" aria-label="Distance">`:`<span></span>`}
        <button class="done" data-cdone="${esc(key)}" data-def="${esc(String(W.r).replace(/\D.*$/,""))}" aria-pressed="${!!c.done}" aria-label="Mark ${esc(e.n)} done">✓</button>
      </div></section>`;
  }
  const scoreLbl = W.score==="time" ? "Time (min)" : W.score==="rounds" ? "Rounds" : "";
  return `<section class="ex circuit"><div class="exhead"><span class="exnum">${num_}</span><span class="exname">${esc(e.n)}</span><span class="tagpill">${esc(W.fmt)}</span></div>
    <div class="exnote">${esc(W.how)}</div>
    <ul class="moves">${W.moves.map(m=>{ const cue = CO ? CO.cues(m.n) : ""; return `<li><b>${esc(m.r)}</b> ${esc(m.n)}${cue?`<details class="cue" style="margin:2px 0 4px"><summary>Form tips</summary><ul>${cue.split(" · ").map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:""}</li>`; }).join("")}</ul>
    <div class="set${c.done?" is-done":""}" style="margin-left:36px;grid-template-columns:1fr 44px">
      ${scoreLbl?`<input inputmode="decimal" placeholder="${esc(scoreLbl)}" value="${esc(c.score||"")}" data-cx="${esc(key)}" data-k="score" aria-label="${esc(scoreLbl)}">`:`<span>All rounds done?</span>`}
      <button class="done" data-cdone="${esc(key)}" aria-pressed="${!!c.done}" aria-label="Mark circuit done">✓</button>
    </div>${c.best?`<p class="tip" style="margin-left:36px">${esc(c.best)}</p>`:""}</section>`;
}
document.addEventListener("input", e=>{ const k = e.target.dataset.cx; if(!k) return; const D = day(cur); D.cardio = D.cardio||{}; D.cardio[k] = D.cardio[k]||{}; D.cardio[k][e.target.dataset.k] = e.target.value.trim(); saveDay(cur); });
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-cdone]"); if(!t) return;
  const D = day(cur); D.cardio = D.cardio||{}; const c = D.cardio[t.dataset.cdone] = D.cardio[t.dataset.cdone]||{};
  c.done = !c.done;
  if(c.done && !c.min && t.dataset.def) c.min = t.dataset.def;
  if(c.done){ const m = cardioMeta(cur, t.dataset.cdone, {}); c.type = m.type; if(m.mod) c.mod = m.mod; if(m.unit) c.unit = m.unit; if(m.fmt) c.fmt = m.fmt; if(m.score) c.st = m.score; }
  if(c.done) celebrate(/^\d+:Conditioning/.test(t.dataset.cdone) ? "Circuit done. Nice work." : "Session logged. Nice work.", false);
  saveDay(cur); render();
});

/* ---------- shared profile + nutrition helpers ---------- */
function trainingDaysPerWeek(){
  if(S.plan && S.plan.days) return S.plan.mode==="recovery" ? 0 : S.plan.days.filter(d=>!d.rest).length;
  return S.nutri && S.nutri.a && S.nutri.a.workDays ? +S.nutri.a.workDays : 3;
}
function latestBody(){
  const ks = Object.keys(S.days).sort();
  const ws = weights(), a = avg7(ws, todayStr());
  const recent = ws.filter(x=>diff(todayStr(),x.d)<7).length;
  const pick = f => { for(let i=ks.length-1;i>=0;i--){ const v = num(S.days[ks[i]][f]); if(v>0) return v; } return null; };
  return {weight: recent>=3 ? a : (ws.length ? ws[ws.length-1].w : null), bf: pick("bf"), waist: pick("waist")};
}
function nutriInputs(){
  const a = {...S.nutri.a, ...S.profile};
  return a;
}
function nutriNow(onDate){
  if(!S.nutri || !N) return null;
  const b = latestBody(), n = S.nutri;
  return N.compute(nutriInputs(), {today:onDate||todayStr(), trainingDays:trainingDaysPerWeek(), weight:b.weight, bf:b.bf, waist:b.waist, adj:n.adj||0, cut:n.cut, ramp:n.ramp});
}
function isTrainingDay(d){
  if(!S.plan) return true;
  const p = progInfo(d); if(p.before) return false;
  const dd = dayDef(p.dn); return dd && !dd.rest;
}
function todayTargets(){ return targetsOn(cur); }
function targetsOn(d){
  const r = nutriNow(d);
  if(!r) return {cal:S.settings.cal, protein:S.settings.protein, carbs:S.settings.carbs, fat:S.settings.fat};
  const carbs = r.cycle && S.plan ? (isTrainingDay(d) ? r.carbsTrain : r.carbsRest) : r.carbs;
  return {cal: carbs===r.carbs ? r.cal : Math.round(r.protein*4 + carbs*4 + r.fat*9), protein:r.protein, carbs, fat:r.fat, r};
}

function planCard(){
  if(!S.plan) return "";
  return `<div class="plancard"><div class="t"><b>${esc(S.plan.title)}</b>Your custom plan</div><button class="linkbtn" id="build">Rebuild</button></div>`;
}
function planLine(p){
  if(!S.plan) return "";
  return `<div class="planline"><span class="t"><b>${esc(S.plan.title)}</b></span><button class="linkbtn sm" id="build">Rebuild</button></div>`;
}
function topRx(r){ return String(r).replace(/^.*-/,""); }   // "8-10" -> "10": what ✓ logs
function trainCrossCards(p){
  let h = "";
  const pregInPlan = S.plan && S.plan.answers && (S.plan.answers.around||[]).includes("pregnant");
  if(S.profile.status==="pregnant" && !pregInPlan && !(S.plan && S.plan.mode==="recovery"))
    h += `<div class="msg"><p>Your nutrition shows you're expecting. Rebuild your plan to get pregnancy-safe workouts.</p><div class="acts"><button class="linkbtn go" data-act="rebuild-preg">Rebuild my plan</button></div></div>`;
  if(p && !p.before && p.week===4 && p.dn>=5 && !S.blockSeen[p.cycle])
    h += `<div class="msg"><p><b>Your 4-week block is almost done.</b> What's next?</p><div class="acts"><button class="linkbtn" id="build">Build the next 4 weeks</button>${S.profile.status!=="pregnant"?`<button class="linkbtn go" data-act="start-cut">Start a cut</button>`:""}<button class="linkbtn" data-act="block-dismiss" data-cycle="${p.cycle}">Later</button></div></div>`;
  return h;
}
function planNotes(){
  if(!S.plan) return "";
  let h = "";
  if(S.plan.warning) h += `<div class="warn"><b>Stop and call your provider</b> ${esc(S.plan.warning.replace(/^Stop and call your OB or midwife if you notice /,"if you notice "))}</div>`;
  if(S.plan.notes && S.plan.notes.length) h += `<details class="notes"><summary>About this plan</summary><ul>${S.plan.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></details>`;
  return h;
}
function renderTrain(){
  if(!S.plan) return `<h2>Let's build your plan</h2><p class="sub">Answer a few quick questions and Adonis builds a 4-week plan around your goal, schedule, equipment and anything you need to work around.</p>
    <button class="primary" id="build" style="background:var(--protein);color:#fff">Build my plan</button>
    <p class="sub" style="margin-top:14px">Moving from another phone? Tap the person icon at the top and choose Restore from backup.</p>`;
  const p = progInfo(cur), D = day(cur);
  if(p.before) return planCard()+`<h2>Not started yet</h2><p class="sub">Your program starts ${esc(parse(S.settings.start).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))}. Change the start date on the Body tab.</p>`;
  const P = dayDef(p.dn);
  if(P.rest){
    return recapCard()+planCard()+trainCrossCards(p)+`<h2>${esc(P.name==="Rest"?"Rest day":"Active recovery")}</h2><p class="sub">Keep it easy. Tap what you did today.</p>
      <div class="chips" id="recov">${RECOVERY.map(r=>`<button class="chip" data-rec="${esc(r)}" aria-pressed="${D.recovery.includes(r)}">${esc(r)}</button>`).join("")}</div>`;
  }
  let n = 0;
  const cards = P.ex.map((e,ei)=>{
    if(e.type==="cardio" || e.type==="circuit"){ n++; return specialCard(e, ei, D, p.week, n); }
    if(e.pair!=="b" && !(e.tag && e.tag.endsWith("b"))) n++;
    const num_ = e.tag || (String(n) + (e.pair||""));
    const name = shown(e, D);
    const R = rx(e, p.week);
    const sets = D.lifts[name] || [];
    while(sets.length < R.s) sets.push({w:"",r:"",done:false});
    D.lifts[name] = sets;
    const last = lastFor(name);
    const mode = S.plan ? S.plan.mode : "normal";
    const sug = CO && !e.amrap ? CO.suggest(name, sessionsFor(name, cur).slice(0,1), R.r, {mode}) : null;
    const hint = sug ? `<span class="sug">${esc(sug.text)}</span>` : last ? `Last time: ${last.w?esc(last.w)+" lb × ":""}${esc(last.r||"—")} reps` : "";
    const cue = CO ? CO.cues(name) : "";
    const swapped = name !== e.n;
    const noteTxt = swapped ? ((E && E.PF_NOTES[name]) || "") : (e.note || "");
    const note = [esc(noteTxt), hint].filter(Boolean).join(". ");
    const bw = isBW(name, e);
    const lib = E && E.BY_NAME[name];
    const simple = lib && (lib.p==="pf" || lib.p==="pfwarm");
    const rows = simple ? sets.slice(0,R.s).map((s,i)=>`
      <div class="set${s.done?" is-done":""}" style="grid-template-columns:22px 1fr 44px">
        <span class="n">${i+1}</span><span>${esc(R.r)}</span>
        <button class="done" data-ex="${esc(name)}" data-orig="${esc(e.n)}" data-i="${i}" aria-pressed="${!!s.done}" aria-label="Mark ${esc(name)} done">✓</button>
      </div>`).join("") : sets.slice(0,R.s).map((s,i)=>`
      <div class="set${s.done?" is-done":""}">
        <span class="n">${i+1}</span>
        ${(()=>{ const wPre = (sets.slice(0,i).reverse().find(x=>x.w!=="")||{}).w || (sug && sug.w ? String(sug.w) : "");
          const amrap = e.amrap && !swapped, rPre = amrap ? "" : topRx(R.r);
          return `<input inputmode="decimal" class="${wPre?"pre":""}" placeholder="${esc(wPre || (bw?"BW":"lb"))}" value="${esc(s.w)}" data-ex="${esc(name)}" data-i="${i}" data-k="w" aria-label="${esc(name)} set ${i+1} weight">
        <span class="x">×</span>
        <input inputmode="numeric" class="${rPre?"pre":""}" placeholder="${esc(amrap?"max":rPre)}" value="${esc(s.r)}" data-ex="${esc(name)}" data-i="${i}" data-k="r" aria-label="${esc(name)} set ${i+1} reps">`; })()}
        <button class="done" data-ex="${esc(name)}" data-orig="${esc(e.n)}" data-i="${i}" data-sw="${sug && sug.w ? sug.w : ""}" aria-pressed="${!!s.done}" aria-label="Mark set ${i+1} done">${s.pr&&!isPregnant()?"PR":"✓"}</button>
      </div>`).join("");
    let sw = "";
    if(E){
      const ctx = S.plan ? S.plan.ctx : null;
      const others = P.ex.map(x=>shown(x,D));
      const easier = E.swap(name, -1, ctx, others), harder = E.swap(name, 1, ctx, others);
      const bits = [];
      if(easier) bits.push(`<button data-swap="${esc(e.n)}" data-to="${esc(easier)}" aria-label="Swap for an easier exercise: ${esc(easier)}">Swap: easier</button>`);
      if(harder) bits.push(`<button data-swap="${esc(e.n)}" data-to="${esc(harder)}" aria-label="Swap for a harder exercise: ${esc(harder)}">Swap: harder</button>`);
      if(swapped) bits.push(`<button data-swap="${esc(e.n)}" data-to="${esc(e.n)}">Undo</button><span class="was">Swapped from ${esc(e.n)}</span>`);
      if(bits.length) sw = `<div class="swaps">${bits.join("")}</div>`;
    }
    return `<section class="ex${(e.tag||e.pair)?" linked":""}">
      <div class="exhead"><span class="exnum">${esc(num_)}</span><span class="exname">${esc(name)}</span>${simple?"":`<span class="tagpill">${R.s} × ${esc(e.amrap&&!swapped?"max":R.r)}</span>`}</div>
      ${note?`<div class="exnote">${note}</div>`:""}
      ${cue||hasDemo(name)?`<details class="cue"><summary>How to do it</summary><div class="fdemo" data-demo="${esc(name)}" hidden></div>${cue?`<ul>${cue.split(" · ").map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}</details>`:""}
      <div class="sets">${rows}</div>${sw}</section>`;
  }).join("");
  const restTxt = S.plan && S.plan.mode==="recovery" ? "Go slowly and rest whenever you need." : "Dark grey numbers are filled in for you: tap ✓ to log them as-is, or type what you actually did.";
  const liftCount = P.ex.filter(x=>x.type!=="cardio" && x.type!=="circuit").length;
  const anyDone = Object.values(D.lifts).some(ss=>ss.some(x=>x.done));

/* ----- shared trend chart ----- */
function avgN(pts, d){ const w = pts.filter(p=>p.d<=d && diff(d,p.d)<7); return w.reduce((a,b)=>a+b.v,0)/w.length; }
function trendChart(pts, o={}){
  if(pts.length < 2) return `<div class="chart"><p class="empty">${esc(o.empty || "Log a few more entries to see a trend here.")}</p></div>`;
  pts = pts.slice(-120);
  const W=320, H=170, L=38, R=12, T=14, B=24, unit = o.unit || "";
  const t0 = pts[0].d; let tEnd = pts[pts.length-1].d;
  const g = o.goal && o.goal.v ? o.goal : null, gDated = g && g.d && g.d > tEnd ? g : null;
  if(gDated) tEnd = gDated.d;
  const ser = o.avg ? pts.map(p=>({d:p.d, v:avgN(pts,p.d)})) : pts;
  const vals = pts.map(p=>p.v).concat(g ? [g.v] : []);
  let mn = Math.min(...vals), mx = Math.max(...vals); const pv = Math.max((mx-mn)*0.12, o.minPad||1); mn -= pv; mx += pv;
  const span = Math.max(diff(tEnd,t0),1);
  const X = d => (L + (W-L-R)*(diff(d,t0)/span)).toFixed(1), Y = v => (H-B-(H-T-B)*((v-mn)/(mx-mn))).toFixed(1);
  const col = o.color || "var(--carbs)", txt = "font:11px var(--body);fill:var(--muted)";
  let s = `<text x="${L-6}" y="${T+4}" text-anchor="end" style="${txt}">${Math.round(mx)}</text><text x="${L-6}" y="${H-B}" text-anchor="end" style="${txt}">${Math.round(mn)}</text>`;
  s += `<text x="${L}" y="${H-6}" style="${txt}">${esc(sd(t0))}</text><text x="${W-R}" y="${H-6}" text-anchor="end" style="${txt}">${esc(sd(tEnd))}</text>`;
  s += `<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" style="stroke:var(--line)"/>`;
  if(g && !gDated) s += `<line x1="${L}" x2="${W-R}" y1="${Y(g.v)}" y2="${Y(g.v)}" style="stroke:var(--cal);stroke-width:1.5;stroke-dasharray:4 4"/>`;
  s += pts.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="${o.avg?2.6:3.2}" style="fill:${o.avg?"var(--muted)":col};opacity:${o.avg?.5:1}"/>`).join("");
  s += `<path d="${ser.map((p,i)=>`${i?"L":"M"}${X(p.d)},${Y(p.v)}`).join(" ")}" style="fill:none;stroke:${col};stroke-width:2.5;stroke-linejoin:round"/>`;
  if(gDated){ const last = ser[ser.length-1];
    s += `<path d="M${X(last.d)},${Y(last.v)} L${X(gDated.d)},${Y(gDated.v)}" style="fill:none;stroke:var(--cal);stroke-width:2;stroke-dasharray:5 4"/><circle cx="${X(gDated.d)}" cy="${Y(gDated.v)}" r="4.5" style="fill:var(--surface);stroke:var(--cal);stroke-width:2"/>`; }
  const leg = [o.avg?`<span><i class="sw" style="background:var(--muted);opacity:.55"></i>Daily</span><span><i class="sw" style="background:${col}"></i>7-day average</span>`:`<span><i class="sw" style="background:${col}"></i>${esc(o.label||"")}</span>`,
    g?`<span><i class="sw" style="background:var(--cal)"></i>Goal ${esc(r1(g.v))}${esc(unit)}${gDated?` by ${esc(sd(gDated.d))}`:""}</span>`:""].join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"Trend")} from ${esc(sd(t0))} to ${esc(sd(pts[pts.length-1].d))}">${s}</svg><div class="legend">${leg}</div></div>`;
}

      : `<details class="rec"><summary><span class="rn">${esc(R.n)}</span><span class="rv">${R.maxReps} reps</span></summary><div class="rbig">Most reps in one set, on ${esc(sd(R.mrD))}</div></details>`).join("") + `</div>`;
  }

      ${R.long?`<li><span>Longest session</span><span>${esc(r1(R.long.v))} min · ${esc(sd(R.long.d))}</span></li>`:""}
      ${R.fast?`<li><span>Fastest pace</span><span>${esc(paceFmt(R.fast.v))} ${esc(PACE[R.unit].lbl)} · ${esc(sd(R.fast.d))}</span></li>`:""}</ul></div>`).join("");

  }

}

/* log or un-log one set (list view and workout mode share this) */
function toggleSet(D, name, orig, i, sw){
  const s = D.lifts[name][i];
  s.done = !s.done;
  const pi=progInfo(cur), P=dayDef(pi.dn), ex=P.ex.find(x=>x.n===orig);
  if(s.done){
    if(s.r===""){ if(ex && !(ex.amrap && name===ex.n)){ s.r=topRx(rx(ex,pi.week).r); } }
    if(s.w===""){ // carry the weight from the set before (most people repeat it), else today's suggestion
      const prevW = D.lifts[name].slice(0, i).reverse().find(x=>x.w!=="");
      if(prevW) s.w = prevW.w; else if(sw) s.w = String(sw);
    }
    if(ex){ D.rx = D.rx || {}; D.rx[name] = String(rx(ex,pi.week).r); }
    // personal record? (needs a previous best to beat)
    const prev = bestE1(name, cur), today = Math.max(0, ...D.lifts[name].filter(x=>x!==s).map(x=>CO.e1rm(num(x.w), num(x.r))));
    const mine = CO.e1rm(num(s.w), num(s.r));
    if(!isPregnant() && prev > 0 && mine > prev && mine > today){ D.lifts[name].forEach(x=>delete x.pr); s.pr = true; celebrate(`New record: ${name}, ${s.w} lb × ${s.r}`, true); }
    const lib = E && E.BY_NAME[name];
    if(!(lib && lib.p==="pfwarm")) startRest(CO.restFor(name, S.plan && S.plan.answers ? S.plan.answers.goal : "muscle", S.plan ? S.plan.mode : "normal"));
  } else { delete s.pr; }
}

      if(arr.includes(v)) arr = arr.filter(x=>x!==v);
      else {
        if(v===q.none) arr = [];
        else arr = arr.filter(x=>x!==q.none);
        (q.excl||[]).forEach(g=>{ if(g.includes(v)) arr = arr.filter(x=>!g.includes(x)); });
        arr.push(v);
      }
      F.a[q.k] = arr; renderBuilder();
    } else {
      F.a[q.k] = v; renderBuilder();
      setTimeout(()=>{ if(bview==="q" && visibleQ()[bi]===q){ next(); } }, 220);
    }
    return;
  }
  if(t.dataset.b==="back"){ if(bview==="sum"){ bview="q"; bi = visibleQ().length-1; } else if(bi>0) bi--; renderBuilder(); return; }
  if(t.dataset.b==="next"){ next(); return; }

});

let MEALPOS = {key:"", i:0};
function initCarousel(){
  const car = $("#mcar"); if(!car) return;
  const cards = car.children, dots = document.querySelectorAll(".dots .dot");
  const go = (i, smooth) => { const c = cards[i]; if(!c) return; car.scrollTo({left: c.offsetLeft - car.offsetLeft, behavior: smooth ? "smooth" : "auto"}); };
  go(MEALPOS.i, false);
  let t = null;
  car.addEventListener("scroll", ()=>{
    clearTimeout(t);
    t = setTimeout(()=>{
      const i = Math.round(car.scrollLeft / car.clientWidth);
      MEALPOS.i = Math.max(0, Math.min(cards.length-1, i));
      dots.forEach((d,k)=>d.setAttribute("aria-selected", k===MEALPOS.i));
    }, 60);
  }, {passive:true});
  const pick = i => { MEALPOS.i = i; go(i, true); dots.forEach((x,k)=>x.setAttribute("aria-selected", k===i)); };
  dots.forEach(d=>d.addEventListener("click", ()=>pick(+d.dataset.dot)));
  // after logging a meal, show the check for a moment, then slide to the next one
  if(MEALPOS.next != null){ const n = MEALPOS.next; MEALPOS.next = null; setTimeout(()=>{ if($("#mcar")===car) pick(n); }, 700); }
}

/* ---------- progress: weekly recap, records, streaks ---------- */
function weekStartOf(d){ const x = parse(d); return addDays(d, -((x.getDay()+6)%7)); }  // Monday
function didWorkout(d){ const D = S.days[d]; if(!D) return false; return !!D.complete || Object.values(D.lifts||{}).some(sets=>sets.some(s=>s.done)) || Object.values(D.cardio||{}).some(c=>c.done); }
function plannedOn(d){ if(!S.plan || d < S.settings.start) return false; return isTrainingDay(d); }
function proteinHit(d){ const D = S.days[d]; if(!D || !D.food || !D.food.length) return false; return totals(D).p >= 0.9 * targetsOn(d).protein; }
function prsBetween(from, to){
  // best new record per exercise in the date range, beating everything before that day
  const out = {}, names = new Set();
  Object.values(S.days).forEach(D=>Object.keys(D.lifts||{}).forEach(n=>names.add(n)));
  names.forEach(n=>{
    let best = 0;
    Object.keys(S.days).sort().forEach(k=>{
      const sets = S.days[k].lifts?.[n]; if(!sets) return;
      let dayBest = null;
      sets.forEach(s=>{ const e = CO.e1rm(num(s.w), num(s.r)); if(e > (dayBest ? dayBest.e : 0)) dayBest = {e, w:s.w, r:s.r}; });
      if(!dayBest) return;
      if(k >= from && k <= to && best > 0 && dayBest.e > best && (!out[n] || dayBest.e > out[n].e)) out[n] = {...dayBest, d:k};
      best = Math.max(best, dayBest.e);
    });
  });
  return Object.entries(out).map(([n,v])=>({name:n, ...v})).sort((a,b)=>b.d.localeCompare(a.d));
}
function weekStats(ws){
  const days = [0,1,2,3,4,5,6].map(i=>addDays(ws,i)), end = days[6], upto = days.filter(d=>d<=todayStr());
  const done = days.filter(didWorkout).length, planned = days.filter(plannedOn).length;
  const prot = upto.filter(proteinHit).length, logged = upto.filter(d=>S.days[d] && S.days[d].food && S.days[d].food.length).length;
  const ws_ = weights(), aEnd = avg7(ws_, end <= todayStr() ? end : todayStr()), aPrev = avg7(ws_, addDays(ws,-1));
  const change = aEnd!=null && aPrev!=null ? Math.round((aEnd - aPrev)*10)/10 : null;
  let goal = null;
  const r = nutriNow(todayStr());
  if(r && r.weight){ const rate = {steady:.005, moderate:.0075, aggressive:.01, slow:.0025, standard:.005}[r.pace] || 0;
    goal = r.goal==="cut" ? -Math.round(r.weight*rate*10)/10 : r.goal==="bulk" ? Math.round(r.weight*rate*10)/10 : 0; }
  return {days, done, planned, prot, logged, change, goal, prs: prsBetween(ws, end)};
}
function streaks(){
  // weeks in a row with every planned workout done (this week counts once it's met)
  let wk = 0, ws = weekStartOf(todayStr());
  const met = w => { const ds = [0,1,2,3,4,5,6].map(i=>addDays(w,i)); const pl = ds.filter(plannedOn).length; return pl > 0 && ds.filter(didWorkout).length >= pl; };
  if(met(ws)) wk++;
  for(let i=1;i<104;i++){ const w = addDays(ws, -7*i); if(w < weekStartOf(S.settings.start || todayStr())) break; if(met(w)) wk++; else break; }
  // days in a row hitting protein (today counts once it's hit)
  let pd = 0, d = proteinHit(todayStr()) ? todayStr() : addDays(todayStr(), -1);
  while(proteinHit(d) && pd < 999){ pd++; d = addDays(d, -1); }
  return {weeks: wk, protein: pd};
}
function weightLine(st){
  if(st.change==null) return "Log your weight a few mornings a week to see your trend.";
  const ch = `${st.change>0?"+":""}${st.change} lb`;
  if(st.goal==null || st.goal===0) return `${ch} on your 7-day average.`;
  const onPace = st.goal<0 ? st.change <= st.goal*0.5 && st.change >= st.goal*1.5 : st.change >= st.goal*0.5 && st.change <= st.goal*1.75;
  return `${ch} on your 7-day average (goal ${st.goal>0?"+":""}${st.goal} lb). ${onPace?"Right on pace.":"Your Eat tab will suggest an adjustment if it stays off."}`;
}

/* ---------- rest timer + toasts ---------- */
let REST = null, restTick = null, audioCtx = null, wakeLock = null;
function audio(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state !== "running") audioCtx.resume();   // iPhone pauses ("interrupted") after calls, other apps, or locking
  }catch(e){}
  return audioCtx;
}
function beep(){
  const ctx = audio();
  try{
    [0, 0.3, 0.6].forEach(off=>{ const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "square"; o.frequency.value = 1000; o.connect(g); g.connect(ctx.destination);
      const t0 = ctx.currentTime + off; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.5, t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+0.22); o.start(t0); o.stop(t0+0.25); });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}   // Android only; iPhone browsers can't vibrate
}
/* keep the screen on while resting, so the phone doesn't lock and silence the timer */
async function holdScreen(on){
  try{
    if(on && !wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock = null; }); }
    if(!on && wakeLock){ const l = wakeLock; wakeLock = null; await l.release(); }
  }catch(e){ wakeLock = null; }
}
function startRest(sec){
  const ctx = audio();   // unlock sound on this tap (iPhone): play a silent blip inside the tap
  try{ const b = ctx.createBuffer(1, 1, 22050), src = ctx.createBufferSource(); src.buffer = b; src.connect(ctx.destination); src.start(0); }catch(e){}
  holdScreen(true);
  REST = {end: Date.now() + sec*1000, total: sec*1000, done:false};
  clearInterval(restTick); restTick = setInterval(drawRest, 250); drawRest();
}
function drawRest(){
  const el = $("#rest");
  if(!REST){ el.hidden = true; clearInterval(restTick); document.body.classList.remove("resting"); holdScreen(false); return; }
  const left = Math.max(0, REST.end - Date.now());
  if(left === 0 && !REST.done){ REST.done = true; beep(); setTimeout(()=>{ if(REST && REST.done){ REST = null; drawRest(); } }, 4000); }
  const mm = Math.floor(Math.ceil(left/1000)/60), ss = String(Math.ceil(left/1000)%60).padStart(2,"0");
  el.hidden = false; el.classList.toggle("go", REST.done); document.body.classList.add("resting");
  el.innerHTML = REST.done
    ? `<div class="rrow"><div class="rt">Go! Next set</div><button data-rest="close">Done</button></div>`
    : `<div class="rrow"><div class="rt"><small>Rest</small>${mm}:${ss}</div><button data-rest="add">+15s</button><button data-rest="skip">Skip</button></div><div class="rbar"><i style="width:${100 - left/REST.total*100}%"></i></div>`;
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && REST){ if(!REST.done) holdScreen(true); drawRest(); } });
$("#rest").addEventListener("click", e=>{
  const b = e.target.closest("[data-rest]"); if(!b || !REST) return;

/* ---------- celebrations: a banner every time, confetti for the wins that matter ---------- */
const REDUCED = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : {matches:false};
function confetti(){
  if(REDUCED.matches) return;
  document.getElementById("confetti")?.remove();
  const cv = document.createElement("canvas"); cv.id = "confetti"; cv.setAttribute("aria-hidden","true"); document.body.appendChild(cv);
  const dpr = Math.min(2, window.devicePixelRatio||1), W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; const g = cv.getContext("2d"); g.scale(dpr,dpr);
  const css = getComputedStyle(document.documentElement), cols = ["--protein","--carbs","--fat","--cal"].map(v=>css.getPropertyValue(v).trim()||"#C23B2E");
  const P = [];
  [[0.12,1],[0.88,-1]].forEach(([x,dir])=>{ for(let i=0;i<70;i++){ const a = (-90 + dir*(15+Math.random()*40))*Math.PI/180, v = 9+Math.random()*9;
    P.push({x:W*x, y:H*0.75, vx:Math.cos(a)*v, vy:Math.sin(a)*v, w:6+Math.random()*6, h:4+Math.random()*4, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[i%cols.length], wob:Math.random()*6}); } });
  let t0 = null;
  const step = ts => {
    if(!t0) t0 = ts; const el = ts - t0;
    g.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy += 0.32; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx + Math.sin(p.wob += .15)*0.6; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.globalAlpha = Math.max(0, 1 - Math.max(0, el-1800)/700); g.fillStyle = p.c; g.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.wob))); g.restore(); });

}

// each win celebrates once per day, even if you edit and re-save
function firstTime(d, key){ const D = day(d); D.cele = D.cele || {}; if(D.cele[key]) return false; D.cele[key] = 1; return true; }
function checkMacroWins(d){
  if(d !== todayStr() || !S.nutri) return;
  const D = S.days[d]; if(!D || !D.food || !D.food.length) return;
  const T = targetsOn(d), t = totals(D); if(!T.protein) return;
  const near = (x, y) => y > 0 && x >= 0.9*y && x <= 1.1*y;
  const protein = t.p >= 0.9*T.protein, all = protein && near(t.c, T.carbs) && near(t.f, T.fat) && near(t.cal, T.cal);
  if(all && firstTime(d, "all")){ firstTime(d, "p"); celebrate("Every macro on target today. Dialed in.", true); return; }
  if(protein && firstTime(d, "p")) celebrate(t.p >= T.protein ? `Protein goal hit: ${Math.round(t.p)} g of ${T.protein} g.` : `Protein goal hit: ${Math.round(t.p)} g, within 10% of ${T.protein} g.`, true);

const BODYSEEN = {};
function checkBodyWins(d, what){
  if(d !== todayStr()) return;
  const val = String((S.days[d]||{})[what==="weight"?"weight":what] ?? "");
  if(BODYSEEN[d+what] === val) return;   // same value saved twice (blur + change): one banner only
  BODYSEEN[d+what] = val;
  const D = S.days[d], r = nutriNow(d), goal = r ? r.goal : "", preg = isPregnant();
  if(what === "weight"){
    const w = num(D.weight); if(!(w > 50)) return;
    const ws = weights(), n = ws.length, a = avg7(ws, d);
    const count = {1:"First weigh-in logged. The trend starts now.", 7:"7 weigh-ins logged. Your trend line is real now.", 14:"14 weigh-ins. Two weeks of data.", 30:"30 weigh-ins logged. That's consistency.", 50:"50 weigh-ins. Locked in.", 100:"100 weigh-ins. Elite consistency."}[n];
    if(count && firstTime(d, "wcount")) return celebrate(count, true);
    // a new best 7-day average in the direction of the goal (needs two weeks of data so one good morning can't fake it)
    if(!preg && n >= 14 && a != null && (goal === "cut" || goal === "bulk")){
      const prev = ws.filter(x=>x.d < d && diff(x.d, ws[0].d) >= 6).map(x=>avg7(ws, x.d));

  }

    const k = what === "bf" ? "bf" : "waist", v = num(D[k]); if(!(v > 0)) return;

}

let scanStream = null, scanTimer = null, scanBusy = false, zxReader = null, detector = null;

async function foundCode(raw){
  if(scanBusy) return; scanBusy = true;
  const code = normCode(raw);
  stopScanner();
  S.foods = S.foods || {};
  let food = S.foods[code] || S.foods[String(raw)];
  if(!food){
    openSheet("Scanned food", `<p class="sub">Looking up ${esc(code)}…</p>`);
    food = await lookupOFF(code, raw);
    if(food && food.found){ S.foods[code] = food; cacheLocal(); }
  }
  scanBusy = false;
  if(food && food.found) showFood(code, food);
  else manualFood(code, food && food.offline);
}
async function lookupOFF(code, raw){
  const fields = "code,product_name,product_name_en,generic_name,brands,serving_size,serving_quantity,nutriments";
  const tryOne = async c => {
    const ctl = new AbortController(), to = setTimeout(()=>ctl.abort(), 8000);
    try{
      const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(c)}.json?fields=${fields}`, {signal:ctl.signal});
      const j = await r.json().catch(()=>null);
      return j;
    } finally { clearTimeout(to); }
  };
  try{
    let j = await tryOne(code);
    if((!j || j.status!==1) && String(raw)!==code) j = await tryOne(String(raw));
    if(!j || j.status!==1 || !j.product) return {found:false};
    return parseOFF(j.product);
  }catch(e){ return {found:false, offline:true}; }
}
/* brand-first names for packaged foods, e.g. "H-E-B Large Eggs" */
const BRAND_FIX = {"heb":"H-E-B","h e b":"H-E-B","h-e-b":"H-E-B","heb organics":"H-E-B Organics","central market":"Central Market","hill country fare":"Hill Country Fare",
  "kirkland":"Kirkland Signature","kirkland signature":"Kirkland Signature","great value":"Great Value","good gather":"Good & Gather","good and gather":"Good & Gather",
  "365":"365","365 by whole foods market":"365","365 everyday value":"365","whole foods market":"365","trader joes":"Trader Joe's","trader joe s":"Trader Joe's","fairlife":"Fairlife","chobani":"Chobani"};
function cleanBrand(raw){
  let b = String(raw||"").split(",")[0].replace(/\s+/g," ").trim();
  if(!b) return "";
  const key = b.toLowerCase().replace(/['’]/g,"").replace(/&/g," ").replace(/[^a-z0-9-]+/g," ").replace(/\s+/g," ").trim();
  if(BRAND_FIX[key]) return BRAND_FIX[key];
  const k2 = key.replace(/-/g," ").trim(); if(BRAND_FIX[k2]) return BRAND_FIX[k2];
  // all-lowercase database entries get capitalized; ALL CAPS is left alone since brands like RXBAR and KIND use it
  if(b === b.toLowerCase())
    b = b.toLowerCase().replace(/(^|[\s-])([a-z])/g, (m,a,c)=>a+c.toUpperCase());
  return b;
}
function foodTitle(food){
  const name = String(food.name||"").trim(), brand = cleanBrand(food.brand);
  if(!brand) return name;
  const flat = x => x.toLowerCase().replace(/[^a-z0-9]/g,"");
  if(flat(name).includes(flat(brand)) || (flat(brand)==="heb" && /h\W?e\W?b/i.test(name))) return name;
  return `${brand} ${name}`;
}
function parseOFF(p){
  const n = p.nutriments || {}, num_ = v => (v===undefined || v===null || v==="") ? null : +v;
  const per100 = {p:num_(n.proteins_100g), c:num_(n.carbohydrates_100g), f:num_(n.fat_100g)};
  const perServ = {p:num_(n.proteins_serving), c:num_(n.carbohydrates_serving), f:num_(n.fat_serving)};
  const sq = num_(p.serving_quantity);
  let per = null, label = "", grams = null;
  if(sq && per100.p!==null && per100.c!==null && per100.f!==null){ per = {p:per100.p*sq/100, c:per100.c*sq/100, f:per100.f*sq/100}; grams = sq; label = p.serving_size || `${sq} g`; }
  else if(perServ.p!==null && perServ.c!==null && perServ.f!==null){ per = perServ; label = p.serving_size || "1 serving"; }
  else if(per100.p!==null && per100.c!==null && per100.f!==null){ per = per100; grams = 100; label = "100 g"; }
  const name = (p.product_name || p.product_name_en || p.generic_name || "").trim();
  if(!per || !name) return {found:false};
  const r1 = x => Math.round(x*10)/10;
  return {found:true, name, brand:cleanBrand(p.brands), label, grams, per:{p:r1(per.p), c:r1(per.c), f:r1(per.f)}, src:"off"};
}
let FOODCTX = null;
function updateFoodKV(){
  const kv = $("#builder .kv"); if(!kv || !FOODCTX) return;
  const {food, qty} = FOODCTX;
  kv.innerHTML = `<dt>Calories</dt><dd>${Math.round((food.k||(food.per.p*4+food.per.c*4+food.per.f*9))*qty)}</dd><dt>Protein</dt><dd>${Math.round(food.per.p*qty)} g</dd><dt>Carbs</dt><dd>${Math.round(food.per.c*qty)} g</dd><dt>Fat</dt><dd>${Math.round(food.per.f*qty)} g</dd>`;
  const u = $("#fqunit"); if(u) u.textContent = qty===1 ? "serving" : "servings";
}
function showFood(code, food){
  FOODCTX = {code, food, qty:1};
  openSheet("Scanned food", foodHTML());
}
function foodHTML(){
  const {food, qty} = FOODCTX, m = k => Math.round(food.per[k]*qty);
  const cal = Math.round((food.k || (food.per.p*4 + food.per.c*4 + food.per.f*9)) * qty);
  return `<div class="food"><div class="fn">${esc(foodTitle(food))}</div>
    <div class="sub" style="margin:0">1 serving = ${esc(food.label)}${food.src==="me"?" (your entry)":""}</div>
    <div class="stepper"><button type="button" data-q="-1" aria-label="Less">−</button><input id="fqty" inputmode="decimal" value="${qty}" aria-label="Servings"><button type="button" data-q="1" aria-label="More">+</button><span id="fqunit">serving${qty===1?"":"s"}</span></div>
    <dl class="kv"><dt>Calories</dt><dd>${cal}</dd><dt>Protein</dt><dd>${m("p")} g</dd><dt>Carbs</dt><dd>${m("c")} g</dd><dt>Fat</dt><dd>${m("f")} g</dd></dl>
    <button class="primary" data-act="food-add">Add to ${cur===todayStr()?"today":"this day"}</button>
    ${FOODCTX.code?`<div class="acts" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="linkbtn" data-act="food-edit">Numbers look wrong? Fix them</button><button class="linkbtn" data-act="food-rescan">Scan another</button></div>`:""}</div>
    ${food.src==="off"?`<p class="tip">From Open Food Facts. Labels change, so check it against the package now and then.</p>`:""}
    ${food.src==="rest"?`<p class="tip">Restaurant numbers are approximate and menus change. Check the restaurant's nutrition info if you need it exact.</p>`:""}
    ${food.k?`<p class="tip">Includes calories from alcohol, which aren't protein, carbs or fat.</p>`:""}`;
}
function manualFood(code, offline, prefill){
  const f = prefill || {};
  FOODCTX = {code, manual:true, prefill:prefill||null};
  openSheet(prefill ? "Fix this food" : "Add this food", `
    <p class="sub">${prefill ? "Update the numbers from the label. Adonis remembers your version for this barcode." : offline ? "You're offline, so this barcode can't be looked up right now. Enter it from the label and Adonis will remember it." : "This barcode isn't in the food database yet. Enter it once from the nutrition label and Adonis will remember it next time."}</p>
    <div class="card"><div class="row">
      <div class="field wide"><label for="mf-name">Food name</label><input id="mf-name" value="${esc(f.name||"")}" placeholder="e.g. H-E-B Protein Bar"></div>
      <div class="field wide"><label for="mf-label">Serving size on the label</label><input id="mf-label" value="${esc(f.label||"")}" placeholder="e.g. 1 bar (60 g)"></div>
      <div class="field"><label for="mf-p">Protein g</label><input id="mf-p" inputmode="decimal" value="${f.per?esc(f.per.p):""}"></div>
      <div class="field"><label for="mf-c">Carbs g</label><input id="mf-c" inputmode="decimal" value="${f.per?esc(f.per.c):""}"></div>
      <div class="field"><label for="mf-f">Fat g</label><input id="mf-f" inputmode="decimal" value="${f.per?esc(f.per.f):""}"></div>
    </div><p class="tip">Per one serving, the way the label shows it. Barcode ${esc(code)}.</p>
    <div class="err" id="mf-err" role="alert"></div>
    <button class="primary" data-act="food-save">Save and continue</button></div>`);
}
document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.act==="scan"){ scanBusy = false; openScanner(); return; }
  if(t.dataset.q && FOODCTX){ FOODCTX.qty = Math.max(0.5, Math.round((FOODCTX.qty + (+t.dataset.q)*0.5)*2)/2); const q = $("#fqty"); if(q) q.value = FOODCTX.qty; updateFoodKV(); return; }
  if(t.dataset.act==="food-add" && FOODCTX){
    const {food, qty, code} = FOODCTX, D = day(cur), r = x => Math.round(x*qty);
    const title = foodTitle(food), nm = `${title}${qty!==1?` (${qty} servings)`:""}`;
    D.food.push({name:nm, p:r(food.per.p), c:r(food.per.c), f:r(food.per.f), ...(food.k?{k:r(food.k)}:{}), ...(code?{code}:{})});
    saveDay(cur); closeBuilder(); setStatus(`Added ${title}`); return;
  }
  if(t.dataset.act==="food-edit" && FOODCTX){ manualFood(FOODCTX.code, false, FOODCTX.food); return; }
  if(t.dataset.act==="food-rescan"){ closeBuilder(); scanBusy = false; openScanner(); return; }
  if(t.dataset.act==="food-save" && FOODCTX){
    const name = $("#mf-name").value.trim(), label = $("#mf-label").value.trim() || "1 serving";
    const p = num($("#mf-p").value), c = num($("#mf-c").value), f = num($("#mf-f").value);
    if(!name){ $("#mf-err").textContent = "Enter a name for this food."; return; }
    if(!p && !c && !f){ $("#mf-err").textContent = "Enter protein, carbs or fat from the label."; return; }
    const prevBrand = FOODCTX.prefill && FOODCTX.prefill.brand && !name.toLowerCase().includes(FOODCTX.prefill.brand.toLowerCase()) ? FOODCTX.prefill.brand : "";
    const food = {found:true, name, brand:prevBrand, label, per:{p, c, f}, src:"me"};
    S.foods = S.foods || {}; S.foods[FOODCTX.code] = food; cacheLocal();
    showFood(FOODCTX.code, food); return;
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="fqty" && FOODCTX){ const v = num(e.target.value); if(v>0){ FOODCTX.qty = v; updateFoodKV(); } }
});

loadLocal();
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
