<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adonis</title>
<meta name="theme-color" content="#ECEEEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121821" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Adonis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --ink:#18202C; --muted:#5E6A78; --line:#D3D8D1; --field:#F5F6F3;
  --protein:#C23B2E; --carbs:#2766B0; --fat:#C99414; --cal:#2E8B57; --focus:#2766B0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121821; --surface:#1B232E; --ink:#E7EAE4; --muted:#95A1AE; --line:#2B3542; --field:#232C38;
    --protein:#E0604F; --carbs:#5B94DA; --fat:#E2B43A; --cal:#4DB07A; --focus:#7FB0EC;
  }
}
:root[data-theme="dark"]{
  --bg:#121821; --surface:#1B232E; --ink:#E7EAE4; --muted:#95A1AE; --line:#2B3542; --field:#232C38;
  --protein:#E0604F; --carbs:#5B94DA; --fat:#E2B43A; --cal:#4DB07A; --focus:#7FB0EC;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.datebar{display:flex;align-items:center;gap:8px}
.datebar h1{flex:1;margin:0;font:700 30px/1 var(--display);letter-spacing:.01em}
.datebar h1 small{display:block;font:500 15px/1.3 var(--body);color:var(--muted);margin-top:4px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:18px}
.todaybtn{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.status{font-size:13px;color:var(--muted);margin-top:6px;min-height:18px}

h2{font:700 24px/1.1 var(--display);margin:22px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.ex.linked{border-left:4px solid var(--carbs)}
.exhead{display:flex;align-items:baseline;gap:10px}
.exnum{font:700 18px var(--display);color:var(--muted);min-width:26px}
.exname{font:600 20px/1.15 var(--display);flex:1}
.exnote{font-size:13px;color:var(--muted);margin:2px 0 8px 36px}
.sets{display:grid;gap:6px;margin-left:36px}
.set{display:grid;grid-template-columns:22px 1fr 14px 1fr 44px;align-items:center;gap:6px}
.set .n{font:600 15px var(--display);color:var(--muted)}
.set .x{color:var(--muted);text-align:center}
.set input,.field input{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);font-variant-numeric:tabular-nums}
.done{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-size:18px;color:var(--muted)}
.set.is-done .done{background:var(--cal);border-color:var(--cal);color:#fff}
.set.is-done input{opacity:.7}
.primary{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:700 19px var(--display);letter-spacing:.02em;cursor:pointer;margin-top:14px}
.primary.ok{background:var(--cal);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px 14px;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.plates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 6px}
.plate{text-align:center}
.plate svg{width:100%;max-width:112px;display:block;margin:0 auto}
.plate .val{font:700 22px/1 var(--display)}
.plate .lbl{font-size:13px;color:var(--muted);margin-top:4px}
.plate .left{font-size:12px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field.wide{grid-column:1/-1}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .nm{flex:1;min-width:0}
.entry .nm b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .mac{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px;width:36px;height:36px;border-radius:50%}
.empty{color:var(--muted);margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font:700 26px/1 var(--display)}
.stat span{font-size:13px;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.chart svg{width:100%;display:block}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px;margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:14px 0;cursor:pointer;font:600 18px var(--display);color:var(--muted);border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.plate circle.fill{transition:stroke-dashoffset .5s ease}}

/* ---------- plan + builder ---------- */
.plancard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0 4px;display:flex;align-items:center;gap:10px}
.plancard .t{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.plancard .t b{display:block;color:var(--ink);font:600 17px/1.2 var(--display)}
.linkbtn{border:1px solid var(--line);background:var(--field);border-radius:20px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.linkbtn.go{background:var(--protein);border-color:var(--protein);color:#fff}
.warn{border:1px solid var(--protein);border-left:4px solid var(--protein);border-radius:0;background:var(--surface);padding:10px 12px;margin:10px 0;font-size:14px}
.warn b{color:var(--protein)}
details.notes{margin:8px 0 0;font-size:14px;color:var(--muted)}
details.notes summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.notes ul{margin:6px 0 0;padding-left:18px}
.swaps{display:flex;gap:6px;margin-left:36px;margin-top:8px;flex-wrap:wrap;align-items:center}
.swaps button{border:1px solid var(--line);background:var(--field);border-radius:16px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.swaps .was{font-size:12px;color:var(--muted)}
#builder{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#builder .in{max-width:560px;margin:0 auto;padding:16px 16px 120px}
#builder .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#builder .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
#builder .bar i{display:block;height:100%;background:var(--protein);transition:width .25s}
#builder h2{font:700 28px/1.1 var(--display);margin:18px 0 6px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font:500 17px/1.3 var(--body)}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.opt .box{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex:none;display:grid;place-items:center;font-size:14px;color:#fff}
.opt.single .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink)}
.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bnav .in2{max-width:560px;margin:0 auto;display:flex;gap:10px}
.bnav button{flex:1;padding:14px;border-radius:10px;font:700 19px var(--display);cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.bnav button.next{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bnav button:disabled{opacity:.4;cursor:default}
.pday{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.pday b{font:600 18px var(--display)}
.pday ol{margin:6px 0 0;padding-left:20px;font-size:15px}
.pday .rest{color:var(--muted);font-size:14px}
.err{color:var(--protein);font-size:14px;min-height:20px;margin-top:8px}

.msg{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cal);border-radius:0;padding:12px 14px;margin:12px 0}
.msg.adj{border-left-color:var(--carbs)}
.msg p{margin:0 0 10px}
.msg .acts{display:flex;gap:8px;flex-wrap:wrap}
.nsum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0 4px}
.nsum .k{font-size:13px;color:var(--muted)}
.nsum .big{font:700 34px/1 var(--display)}
.nsum .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.flds .field input{font-size:18px;padding:12px}
.flds .wide{grid-column:1/-1}
.tip{font-size:13px;color:var(--muted);margin-top:4px}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

.meal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.meal .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meal .nm{font:600 20px/1.15 var(--display);margin:2px 0}
.meal .mac{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.meal details{margin-top:6px;font-size:14px}
.meal details summary{cursor:pointer;color:var(--ink);font-weight:600}
.meal .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.meal .mtag{font-size:13px;color:var(--protein);font-weight:600;margin:2px 0 2px}
.meal ol.steps{margin:8px 0 0;padding-left:22px;font-size:15px;line-height:1.5}
.meal ol.steps li{margin:0 0 8px}
.meal .xtra{font-size:14px;margin:6px 0 0;padding:8px 10px;background:var(--field);border-radius:8px}
.prepsteps{margin:0;padding-left:22px;font-size:15px;line-height:1.5}
.prepsteps li{margin:0 0 10px}
.meal .linkbtn.done{background:var(--cal);border-color:var(--cal);color:#fff}
.mtools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.glist label{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.glist label:first-of-type{border-top:0}
.glist input{width:20px;height:20px;flex:none}
.glist .amt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.glist label.got span:first-of-type{text-decoration:line-through;color:var(--muted)}

#scanner{position:fixed;inset:0;z-index:60;background:#000;color:#fff}
#scanvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanframe{position:absolute;left:10%;right:10%;top:32%;height:22%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.scantop{position:absolute;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:12px;font:600 17px var(--body)}
.scantop .iconbtn{background:rgba(255,255,255,.15);border-color:transparent;color:#fff}
.scanbottom{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.7)}
.scanbottom label{font-size:14px;display:block;margin-bottom:6px}
.row2{display:flex;gap:8px}
.row2 input{flex:1;min-width:0;padding:12px;border-radius:8px;border:0;font-size:18px;background:#fff;color:#111}
.food{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.food .brand{font-size:13px;color:var(--muted)}
.food .fn{font:600 22px/1.15 var(--display);margin:2px 0 8px}
.stepper{display:flex;align-items:center;gap:10px;margin:10px 0}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--field);font-size:22px;cursor:pointer}
.stepper input{width:80px;text-align:center;font-size:20px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--field)}

/* ---------- home ---------- */
#home{position:fixed;inset:0;z-index:50;background:#18202C;color:#ECEEEA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:env(safe-area-inset-top,0px) 24px env(safe-area-inset-bottom,0px);text-align:center}
#home .logo{width:min(56vw,240px);height:auto;display:block}
#home h1{margin:18px 0 6px;font:700 56px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
#home p{margin:0 0 44px;color:#95A1AE;font:500 17px/1.3 var(--body)}
#home button{width:100%;max-width:340px;padding:18px 20px;border:0;border-radius:12px;background:#C23B2E;color:#fff;font:700 24px/1 var(--display);letter-spacing:.03em;cursor:pointer;box-shadow:0 6px 0 #8E2A21}
#home button:active{transform:translateY(4px);box-shadow:0 2px 0 #8E2A21}
#home.leaving{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){#home{transition:opacity .35s ease}#home .logo{animation:rise .6s ease both}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
body.on-home{overflow:hidden}
</style>
</head>
<body class="on-home">
<section id="home" aria-label="Welcome">
  <svg class="logo" viewBox="140 270 744 600" role="img" aria-label="Adonis logo">
    <g transform="translate(0 52)">
      <clipPath id="hc"><rect x="0" y="0" width="1024" height="800"/></clipPath>
      <g clip-path="url(#hc)"><path d="M300 860 L512 300 L724 860" fill="none" stroke="#ECEEEA" stroke-width="128" stroke-miterlimit="10"/></g>
      <rect x="200" y="598" width="624" height="34" rx="6" fill="#ECEEEA"/>
      <rect x="214" y="510" width="52" height="210" rx="10" fill="#C23B2E"/>
      <rect x="166" y="545" width="40" height="140" rx="9" fill="#C23B2E"/>
      <rect x="758" y="510" width="52" height="210" rx="10" fill="#C23B2E"/>
      <rect x="818" y="545" width="40" height="140" rx="9" fill="#C23B2E"/>
    </g>
  </svg>
  <h1>Adonis</h1>
  <p>Train. Eat. Track.</p>
  <button id="board" type="button">Board the Gains Train</button>
</section>
<div class="wrap">
  <header>
    <div class="datebar">
      <button class="iconbtn" id="prev" aria-label="Previous day">‹</button>
      <h1 id="dtitle">Today<small id="dsub"></small></h1>
      <button class="todaybtn" id="today">Today</button>
      <button class="iconbtn" id="next" aria-label="Next day">›</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </header>
  <main id="main"></main>
</div>
<section id="builder" hidden aria-label="Build my plan"></section>
<section id="scanner" hidden aria-label="Barcode scanner">
  <video id="scanvid" playsinline muted autoplay></video>
  <div class="scanframe" aria-hidden="true"></div>
  <div class="scantop"><button class="iconbtn" id="scanclose" aria-label="Close scanner">✕</button><span id="scanmsg" role="status">Point your camera at the barcode</span></div>
  <form class="scanbottom" id="scantype"><label for="scancode">Or type the number under the barcode</label><div class="row2"><input id="scancode" inputmode="numeric" autocomplete="off" placeholder="e.g. 049000028911"><button class="linkbtn go" type="submit">Look up</button></div>
  <p class="tip" style="color:#c9d1db">Looks up the number in Open Food Facts, a free public food database. Nothing else leaves your phone.</p></form>
</section>
<nav class="tabs" aria-label="Sections"><div class="in" role="tablist">
  <button role="tab" data-tab="train" aria-selected="true">Train</button>
  <button role="tab" data-tab="eat" aria-selected="false">Eat</button>
  <button role="tab" data-tab="body" aria-selected="false">Body</button>
</div></nav>

<script src="engine.js"></script>
<script src="nutrition.js"></script>
<script src="meals.js"></script>
<script>
const DEFAULTS = {start:todayStr(), cal:2400, protein:175, carbs:265, fat:70, goalWeight:175, goalBf:15, goalDate:""};
const RECOVERY = ["Walking","Yoga","Stretching","Mobility","Hiking","Foam rolling","Biking"];

/* ---------- state ---------- */
let S = {settings:{...DEFAULTS}, days:{}, plan:null, profile:{}, nutri:null, blockSeen:{}, mealplan:null, foods:{}};
const MP = window.AdonisMeals;
const N = window.AdonisNutrition;
const E = window.AdonisEngine;
let cur = todayStr();
let tab = "train";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function pad(n){return String(n).padStart(2,"0")}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function fmt(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function diff(a,b){return Math.round((parse(a)-parse(b))/864e5)}
function num(v){const n=parseFloat(v);return isFinite(n)?n:0}

function day(d){
  if(!S.days[d]) S.days[d] = {date:d, food:[], lifts:{}, weight:"", bf:"", recovery:[], complete:false};
  return S.days[d];
}
function progInfo(d){
  const idx = diff(d, S.settings.start);
  if(idx < 0) return {before:true, inDays:-idx};
  return {cycle:Math.floor(idx/28)+1, week:Math.floor((idx%28)/7)+1, dn:idx%7+1};
}

function dayDef(dn){ return S.plan ? S.plan.days[dn-1] : null; }
function weekNote(w){ return S.plan ? S.plan.weekNotes[w-1] : ""; }
function rx(e, w){ return e.wk ? e.wk[w-1] : {s:3, r:"10"}; }
function shown(e, D){ return (D.swap && D.swap[e.n]) || e.n; }
function isBW(name, e){ const x = E && E.BY_NAME[name]; return x ? (x.eq.length===0 && x.p!=="cond") : !!e.bw; }

/* ---------- storage ---------- */
function cacheLocal(){try{localStorage.setItem("adonis-v1", JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem("adonis-v1");if(r){const o=JSON.parse(r);S={settings:{...DEFAULTS,...o.settings},days:o.days||{},plan:o.plan||null,profile:o.profile||{},nutri:o.nutri||null,blockSeen:o.blockSeen||{},mealplan:o.mealplan||null,foods:o.foods||{}}}}catch(e){}}
function setStatus(t){$("#status").textContent=t}
const timers = {};
function saveDay(d){
  clearTimeout(timers[d]);
  timers[d] = setTimeout(()=>{cacheLocal();setStatus("Saved")},300);
}
function saveSettings(){
  clearTimeout(timers.settings);
  timers.settings = setTimeout(()=>{cacheLocal();setStatus("Saved")},300);
}

/* ---------- backup ---------- */
function markBackup(){ S.settings.lastBackup = todayStr(); S.settings.backupSnooze = ""; cacheLocal(); render(); }
function backupBanner(){
  const logged = Object.keys(S.days).length;
  if(logged < 3) return "";
  const last = S.settings.lastBackup, sn = S.settings.backupSnooze;
  if(sn && diff(todayStr(), sn) < 3) return "";
  const days = last ? diff(todayStr(), last) : null;
  if(days !== null && days < 14) return "";
  return `<div class="msg adj"><p>${days===null ? "You haven't backed up yet." : `It's been ${days} days since your last backup.`} Your logs live only on this phone, so a backup keeps them safe.</p><div class="acts"><button class="linkbtn go" id="export">Save backup</button><button class="linkbtn" data-act="backup-later">Later</button></div></div>`;
}
async function exportData(){
  const name = `adonis-backup-${todayStr()}.json`;
  const blob = new Blob([JSON.stringify({app:"adonis",version:1,exported:new Date().toISOString(),...S},null,1)],{type:"application/json"});
  try{
    const file = new File([blob], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Adonis backup"});
      markBackup(); setStatus("Backup saved"); return;
    }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  markBackup(); setStatus("Backup downloaded");
}
async function importData(file){
  try{
    const o = JSON.parse(await file.text());
    if(!o || typeof o!=="object" || !o.days) throw new Error("bad");
    const n = Object.keys(o.days).length;
    if(!confirm(`Restore this backup (${n} logged day${n===1?"":"s"})? Days in the backup replace the same days on this phone.`)) return;
    S.settings = {...DEFAULTS, ...S.settings, ...(o.settings||{})};
    for(const d in o.days) S.days[d] = o.days[d];
    if(o.plan) S.plan = o.plan;
    if(o.profile) S.profile = {...S.profile, ...o.profile};
    if(o.nutri) S.nutri = o.nutri;
    if(o.mealplan) S.mealplan = o.mealplan;
    if(o.foods) S.foods = {...(S.foods||{}), ...o.foods};
    cacheLocal(); render(); setStatus("Backup restored");
  }catch(e){ setStatus("That file isn't an Adonis backup.") }
}

/* ---------- header ---------- */
function renderHeader(){
  const d = parse(cur), t = todayStr();
  const label = cur===t ? "Today" : cur===addDays(t,-1) ? "Yesterday" : cur===addDays(t,1) ? "Tomorrow"
    : d.toLocaleDateString(undefined,{weekday:"long"});
  const p = progInfo(cur);
  let sub = d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  if(p.before) sub += `. Program starts in ${p.inDays} day${p.inDays>1?"s":""}.`;
  else if(S.plan) sub += `. ${p.cycle>1?`Round ${p.cycle}, w`:"W"}eek ${p.week}, day ${p.dn}: ${dayDef(p.dn).name}`;
  $("#dtitle").innerHTML = `${esc(label)}<small>${esc(sub)}</small>`;
  $("#today").hidden = cur===t;
}

/* ---------- train ---------- */
function lastFor(name){
  const dates = Object.keys(S.days).filter(k=>k<cur).sort().reverse();
  for(const k of dates){
    const sets = S.days[k].lifts?.[name];
    if(sets && sets.some(s=>s.w!==""||s.r!=="")){
      const best = sets.filter(s=>s.w!==""||s.r!=="").reduce((a,b)=>num(b.w)>num(a.w)?b:a);
      return {date:k, w:best.w, r:best.r};
    }
  }
  return null;
}
/* ---------- shared profile + nutrition helpers ---------- */
function trainingDaysPerWeek(){
  if(S.plan && S.plan.days) return S.plan.mode==="recovery" ? 0 : S.plan.days.filter(d=>!d.rest).length;
  return S.nutri && S.nutri.a && S.nutri.a.workDays ? +S.nutri.a.workDays : 3;
}
function latestBody(){
  const ks = Object.keys(S.days).sort();
  const ws = weights(), a = avg7(ws, todayStr());
  const recent = ws.filter(x=>diff(todayStr(),x.d)<7).length;
  const pick = f => { for(let i=ks.length-1;i>=0;i--){ const v = num(S.days[ks[i]][f]); if(v>0) return v; } return null; };
  return {weight: recent>=3 ? a : (ws.length ? ws[ws.length-1].w : null), bf: pick("bf"), waist: pick("waist")};
}
function nutriInputs(){
  const a = {...S.nutri.a, ...S.profile};
  return a;
}
function nutriNow(onDate){
  if(!S.nutri || !N) return null;
  const b = latestBody(), n = S.nutri;
  return N.compute(nutriInputs(), {today:onDate||todayStr(), trainingDays:trainingDaysPerWeek(), weight:b.weight, bf:b.bf, waist:b.waist, adj:n.adj||0, cut:n.cut, ramp:n.ramp});
}
function isTrainingDay(d){
  if(!S.plan) return true;
  const p = progInfo(d); if(p.before) return false;
  const dd = dayDef(p.dn); return dd && !dd.rest;
}
function todayTargets(){ return targetsOn(cur); }
function targetsOn(d){
  const r = nutriNow(d);
  if(!r) return {cal:S.settings.cal, protein:S.settings.protein, carbs:S.settings.carbs, fat:S.settings.fat};
  const carbs = r.cycle && S.plan ? (isTrainingDay(d) ? r.carbsTrain : r.carbsRest) : r.carbs;
  return {cal: carbs===r.carbs ? r.cal : Math.round(r.protein*4 + carbs*4 + r.fat*9), protein:r.protein, carbs, fat:r.fat, r};
}

function planCard(){
  if(!S.plan) return "";
  return `<div class="plancard"><div class="t"><b>${esc(S.plan.title)}</b>Your custom plan</div><button class="linkbtn" id="build">Rebuild</button></div>`;
}
function trainCrossCards(p){
  let h = "";
  const pregInPlan = S.plan && S.plan.answers && (S.plan.answers.around||[]).includes("pregnant");
  if(S.profile.status==="pregnant" && !pregInPlan && !(S.plan && S.plan.mode==="recovery"))
    h += `<div class="msg"><p>Your nutrition shows you're expecting. Rebuild your plan to get pregnancy-safe workouts.</p><div class="acts"><button class="linkbtn go" data-act="rebuild-preg">Rebuild my plan</button></div></div>`;
  if(p && !p.before && p.week===4 && p.dn>=5 && !S.blockSeen[p.cycle])
    h += `<div class="msg"><p><b>Your 4-week block is almost done.</b> What's next?</p><div class="acts"><button class="linkbtn" id="build">Build the next 4 weeks</button>${S.profile.status!=="pregnant"?`<button class="linkbtn go" data-act="start-cut">Start a cut</button>`:""}<button class="linkbtn" data-act="block-dismiss" data-cycle="${p.cycle}">Later</button></div></div>`;
  return h;
}
function planNotes(){
  if(!S.plan) return "";
  let h = "";
  if(S.plan.warning) h += `<div class="warn"><b>Stop and call your provider</b> ${esc(S.plan.warning.replace(/^Stop and call your OB or midwife if you notice /,"if you notice "))}</div>`;
  if(S.plan.notes && S.plan.notes.length) h += `<details class="notes"><summary>About this plan</summary><ul>${S.plan.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></details>`;
  return h;
}
function renderTrain(){
  if(!S.plan) return `<h2>Let's build your plan</h2><p class="sub">Answer a few quick questions and Adonis builds a 4-week plan around your goal, schedule, equipment and anything you need to work around.</p>
    <button class="primary" id="build" style="background:var(--protein);color:#fff">Build my plan</button>
    <p class="sub" style="margin-top:14px">Moving from another phone? Restore your backup on the Body tab.</p>`;
  const p = progInfo(cur), D = day(cur);
  if(p.before) return planCard()+`<h2>Not started yet</h2><p class="sub">Your program starts ${esc(parse(S.settings.start).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))}. Change the start date on the Body tab.</p>`;
  const P = dayDef(p.dn);
  if(P.rest){
    return planCard()+trainCrossCards(p)+`<h2>${esc(P.name==="Rest"?"Rest day":"Active recovery")}</h2><p class="sub">Keep it easy. Tap what you did today.</p>
      <div class="chips" id="recov">${RECOVERY.map(r=>`<button class="chip" data-rec="${esc(r)}" aria-pressed="${D.recovery.includes(r)}">${esc(r)}</button>`).join("")}</div>`;
  }
  let n = 0;
  const cards = P.ex.map((e,ei)=>{
    if(e.pair!=="b" && !(e.tag && e.tag.endsWith("b"))) n++;
    const num_ = e.tag || (String(n) + (e.pair||""));
    const name = shown(e, D);
    const R = rx(e, p.week);
    const sets = D.lifts[name] || [];
    while(sets.length < R.s) sets.push({w:"",r:"",done:false});
    D.lifts[name] = sets;
    const last = lastFor(name);
    const hint = last ? `Last time: ${last.w?esc(last.w)+" lb × ":""}${esc(last.r||"—")} reps` : "";
    const swapped = name !== e.n;
    const noteTxt = swapped ? ((E && E.PF_NOTES[name]) || "") : (e.note || "");
    const note = [esc(noteTxt), hint].filter(Boolean).join(". ");
    const bw = isBW(name, e);
    const lib = E && E.BY_NAME[name];
    const simple = lib && (lib.p==="pf" || lib.p==="pfwarm");
    const rows = simple ? sets.slice(0,R.s).map((s,i)=>`
      <div class="set${s.done?" is-done":""}" style="grid-template-columns:22px 1fr 44px">
        <span class="n">${i+1}</span><span>${esc(R.r)}</span>
        <button class="done" data-ex="${esc(name)}" data-orig="${esc(e.n)}" data-i="${i}" aria-pressed="${!!s.done}" aria-label="Mark ${esc(name)} done">✓</button>
      </div>`).join("") : sets.slice(0,R.s).map((s,i)=>`
      <div class="set${s.done?" is-done":""}">
        <span class="n">${i+1}</span>
        <input inputmode="decimal" placeholder="${bw?"BW":"lb"}" value="${esc(s.w)}" data-ex="${esc(name)}" data-i="${i}" data-k="w" aria-label="${esc(name)} set ${i+1} weight">
        <span class="x">×</span>
        <input inputmode="numeric" placeholder="${e.amrap&&!swapped?"max":esc(R.r)}" value="${esc(s.r)}" data-ex="${esc(name)}" data-i="${i}" data-k="r" aria-label="${esc(name)} set ${i+1} reps">
        <button class="done" data-ex="${esc(name)}" data-orig="${esc(e.n)}" data-i="${i}" aria-pressed="${!!s.done}" aria-label="Mark set ${i+1} done">✓</button>
      </div>`).join("");
    let sw = "";
    if(E){
      const ctx = S.plan ? S.plan.ctx : null;
      const others = P.ex.map(x=>shown(x,D));
      const easier = E.swap(name, -1, ctx, others), harder = E.swap(name, 1, ctx, others);
      const bits = [];
      if(easier) bits.push(`<button data-swap="${esc(e.n)}" data-to="${esc(easier)}">Easier</button>`);
      if(harder) bits.push(`<button data-swap="${esc(e.n)}" data-to="${esc(harder)}">Harder</button>`);
      if(swapped) bits.push(`<button data-swap="${esc(e.n)}" data-to="${esc(e.n)}">Undo</button><span class="was">Swapped from ${esc(e.n)}</span>`);
      if(bits.length) sw = `<div class="swaps">${bits.join("")}</div>`;
    }
    return `<section class="ex${(e.tag||e.pair)?" linked":""}">
      <div class="exhead"><span class="exnum">${esc(num_)}</span><span class="exname">${esc(name)}</span></div>
      <div class="exnote">${note||"&nbsp;"}</div>
      <div class="sets">${rows}</div>${sw}</section>`;
  }).join("");
  const restTxt = S.plan && S.plan.mode==="recovery" ? "Go slowly and rest whenever you need." : "Rest 60–90 seconds between sets.";
  return `${planCard()}${trainCrossCards(p)}${planNotes()}<h2>${esc(P.name)}</h2><p class="sub">${esc(weekNote(p.week).replace(/([^.!?])$/,"$1."))} ${restTxt}</p>
    <div id="lifts">${cards}</div>
    <button class="primary${D.complete?" ok":""}" id="complete">${D.complete?"Workout finished ✓":"Finish workout"}</button>`;
}

/* ---------- eat ---------- */
function totals(D){
  const t = {p:0,c:0,f:0};
  D.food.forEach(x=>{t.p+=num(x.p);t.c+=num(x.c);t.f+=num(x.f)});
  t.cal = Math.round(t.p*4 + t.c*4 + t.f*9);
  return t;
}
function plate(val, target, color, label, unit){
  const r = 40, C = 2*Math.PI*r, pct = Math.min(val/(target||1),1);
  const left = Math.round(target - val);
  return `<div class="plate">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" style="fill:none;stroke:var(--line);stroke-width:1"/>
      <circle cx="50" cy="50" r="${r}" style="fill:none;stroke:var(--line);stroke-width:10"/>
      <circle class="fill" cx="50" cy="50" r="${r}" transform="rotate(-90 50 50)" style="fill:none;stroke:${color};stroke-width:10;stroke-linecap:round;stroke-dasharray:${C};stroke-dashoffset:${C*(1-pct)}"/>
      <circle cx="50" cy="50" r="7" style="fill:var(--bg);stroke:var(--line)"/>
    </svg>
    <div class="val">${Math.round(val)}</div>
    <div class="lbl">${label}</div>
    <div class="left">${left>=0?`${left}${unit} left`:`${-left}${unit} over`}</div>
  </div>`;
}
function recentFoods(){
  const seen = new Map();
  Object.keys(S.days).sort().reverse().forEach(k=>S.days[k].food.forEach(f=>{
    const key = f.name.trim().toLowerCase();
    if(key && !seen.has(key)) seen.set(key,f);
  }));
  return [...seen.values()].slice(0,12);
}
const PREG_MSG = {
  first: {1:"Congrats on the pregnancy! Your calories stay about the same for now. I'll raise them automatically when you reach your second trimester.",
          2:"Congrats on the pregnancy! I've auto-adjusted your daily calories to maintain a safe nutritional balance as your baby grows.",
          3:"Congrats on the pregnancy! I've auto-adjusted your daily calories to maintain a safe nutritional balance as your baby grows."},
  next: {2:"You're in your second trimester! I've raised your daily calories to support your baby's growth.",
         3:"You're in your third trimester! I've added a little more to support your baby's growth."}
};
function eatMessages(r){
  const n = S.nutri, seen = n.seen || (n.seen = {}), out = [];
  const pf = S.profile;
  // new baby: training plan says postpartum while we still think pregnant
  if(pf.status==="ask"){
    out.push(`<div class="msg"><p><b>Congrats on your new baby!</b> Are you breastfeeding? It changes how much you need to eat.</p><div class="acts"><button class="linkbtn go" data-act="bf-yes">Yes</button><button class="linkbtn" data-act="bf-no">No</button></div></div>`);
    return out.join("");
  }
  if(r.status==="pregnant" && pf.dueDate){
    const tri = r.trimester, base = "preg";
    const anySeen = [1,2,3].some(t=>seen[base+"-"+t]);
    const key = base+"-"+tri;
    if(!seen[key]){
      const text = anySeen ? (PREG_MSG.next[tri] || PREG_MSG.first[tri]) : PREG_MSG.first[tri];
      out.push(`<div class="msg"><p>${esc(text)}</p><div class="acts"><button class="linkbtn" data-seen="${esc(key)}">Got it</button></div></div>`);
    }
    if(N.daysBetween(todayStr(), pf.dueDate) > 14 && !seen[base+"-past"])
      out.push(`<div class="msg adj"><p>Your due date has passed. When you're ready, update your details so your targets stay accurate.</p><div class="acts"><button class="linkbtn" data-act="nutri-edit">Update my details</button><button class="linkbtn" data-seen="${esc(base+"-past")}">Later</button></div></div>`);
  }
  if(r.status==="breastfeeding" && !seen["bf-on"])
    out.push(`<div class="msg"><p>${n.bfFromAsk?"":"Congrats on your new baby! "}Since you're breastfeeding, I've auto-adjusted your daily calories to support milk production and your recovery.</p><div class="acts"><button class="linkbtn" data-seen="bf-on">Got it</button></div></div>`);
  if(n.bfOff && !seen["bf-off-"+n.bfOff])
    out.push(`<div class="msg"><p>Got it. Your calories will ease back down over the next two weeks so it isn't a sudden drop.</p><div class="acts"><button class="linkbtn" data-seen="bf-off-${esc(n.bfOff)}">Got it</button></div></div>`);
  if(r.cut && r.cut.done)
    out.push(`<div class="msg"><p><b>You finished your ${r.cut.weeks}-week cut.</b> Nice work. Next, I'll bring your calories back up to maintenance over two weeks so the scale doesn't jump.</p><div class="acts"><button class="linkbtn go" data-act="cut-finish">Move to maintenance</button></div></div>`);
  // weekly trend check (never during pregnancy)
  if(r.status!=="pregnant" && !(r.cut && r.cut.done)){
    const snoozed = n.snooze && N.daysBetween(todayStr(), n.snooze) < 7;
    const startedAgo = n.started ? N.daysBetween(todayStr(), n.started) : 99;
    if(!snoozed && startedAgo >= 14){
      const sug = N.trendCheck(weights(), r.goal, r.pace, todayStr(), r.weight);
      if(sug){
        out.push(`<div class="msg adj"><p>${esc(sug.why)}: ${sug.change>0?"+":""}${sug.change} lb this week${r.goal!=="maintain"?` against a goal of ${sug.target>0?"+":""}${sug.target} lb`:""}. ${sug.adj<0?"Lower":"Raise"} your daily calories by ${Math.abs(sug.adj)}?</p><div class="acts"><button class="linkbtn go" data-act="adj-yes" data-adj="${sug.adj}">Yes, update</button><button class="linkbtn" data-act="adj-no">Not now</button></div></div>`);
      }
    }
  }
  return out.join("");
}
function goalLine(r){
  if(r.status==="pregnant") return `Pregnancy, week ${Math.max(1,r.gestWeeks)}${r.trimester?` (trimester ${r.trimester})`:""}`;
  if(r.cut && !r.cut.done) return `Cut: week ${r.cut.week} of ${r.cut.weeks}`;
  if(r.ramp) return `Back to maintenance: day ${r.ramp.day} of ${r.ramp.days}`;
  const g = {cut:"Cut", maintain:"Maintain / recomp", bulk:"Lean bulk"}[r.goal] || "Maintain";
  return g + (r.status==="breastfeeding" ? " while breastfeeding" : "");
}
function renderEat(){
  const D = day(cur), t = totals(D), T = todayTargets(), r = T.r;
  let top = "";
  if(!S.nutri){
    top = `<h2>Let's set up your nutrition</h2><p class="sub">A few quick questions and Adonis sets your daily calories, protein, carbs and fat. It updates itself as your weight and training change.</p>

  } else {
    const canCut = r.status!=="pregnant" && !(r.cut && !r.cut.done);
    top = `${eatMessages(r)}<div class="nsum"><div class="k">${esc(goalLine(r))}${r.cycle&&S.plan?` · ${isTrainingDay(cur)?"Training day":"Rest day"} carbs`:""}</div>
      <div class="big">${T.cal.toLocaleString()} <span class="k">calories today</span></div>
      <div class="acts">${canCut?`<button class="linkbtn" data-act="start-cut">Start a cut</button>`:""}${r.cut && !r.cut.done?`<button class="linkbtn" data-act="cut-end">End cut early</button>`:""}${r.status==="breastfeeding"?`<button class="linkbtn" data-act="bf-stop">Stopped breastfeeding</button>`:""}<button class="linkbtn" data-act="nutri-edit">Edit my answers</button><button class="linkbtn" data-act="nutri-why">How this is calculated</button></div>
      <div id="why" hidden>${whyBlock(r)}</div></div>`;

    <div class="entry"><div class="nm"><b>${esc(f.name||"Food")}</b>
      <span class="mac">${Math.round(num(f.p)*4+num(f.c)*4+num(f.f)*9)} cal. P ${num(f.p)}, C ${num(f.c)}, F ${num(f.f)}</span></div>
      <button class="del" data-del="${i}" aria-label="Remove ${esc(f.name)}">×</button></div>`).join("")
    : `<p class="empty">Nothing logged yet. Add your first meal below.</p>`;
  const recent = recentFoods();
  return `${top}<div class="plates">
      ${plate(t.p, T.protein, "var(--protein)", "Protein", "g")}
      ${plate(t.c, T.carbs, "var(--carbs)", "Carbs", "g")}
      ${plate(t.f, T.fat, "var(--fat)", "Fat", "g")}
      ${plate(t.cal, T.cal, "var(--cal)", "Calories", "")}
    </div>
    ${mealSection(D, T)}
    <h2>Logged</h2>
    <div class="card">${list}</div>
    <h2>Add food</h2>
    <button class="primary" data-act="scan" style="margin:0 0 10px;background:var(--protein);color:#fff">Scan a barcode</button>
    <div class="card">
      <div class="row">
        <div class="field wide"><label for="fn">Name</label><input id="fn" placeholder="e.g. Chicken and rice"></div>
        <div class="field"><label for="fp">Protein g</label><input id="fp" inputmode="decimal"></div>
        <div class="field"><label for="fc">Carbs g</label><input id="fc" inputmode="decimal"></div>
        <div class="field"><label for="ff">Fat g</label><input id="ff" inputmode="decimal"></div>
        <div class="field"><label>Calories</label><input id="fcal" disabled value="0"></div>
      </div>
      <button class="primary" id="addfood">Add food</button>
    </div>
    ${recent.length?`<h2>Add again</h2><p class="sub">Tap to log a food you've had before.</p>
      <div class="chips">${recent.map((f,i)=>`<button class="chip" data-re="${i}">${esc(f.name)}</button>`).join("")}</div>`:""}`;
}
function whyBlock(r){
  const rows = [
    ["Weight used", r.weight+" lb"],
    ["Body fat", r.bf!=null ? `${r.bf}% (from ${r.bfSource})` : "Not used"],
    ["BMI", r.bmi],
    ["Burn at rest", `${r.bmr.toLocaleString()} cal (${r.bmrHow})`],
    ["With activity", `${r.tdee.toLocaleString()} cal (×${r.mult}: ${r.lifeLbl.toLowerCase()}, ${trainingDaysPerWeek()} training days)`],
  ];
  if(r.delta) rows.push([r.delta<0?"Cut":"Bulk", `${r.delta>0?"+":""}${r.delta} cal`]);
  if(r.extra) rows.push([r.status==="pregnant"?"Pregnancy":"Breastfeeding", `+${r.extra} cal`]);
  if(S.nutri.adj) rows.push(["Weekly check-ins", `${S.nutri.adj>0?"+":""}${S.nutri.adj} cal`]);
  rows.push(["Protein", `${r.protein} g`], ["Fat", `${r.fat} g`], ["Carbs", r.cycle?`${r.carbsTrain} g training days, ${r.carbsRest} g rest days`:`${r.carbs} g`]);
  return `<dl class="kv" style="margin-top:12px">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>${r.notes.length?`<ul class="sub" style="padding-left:18px;margin:10px 0 0">${r.notes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}`;
}

/* ---------- body ---------- */
function weights(){
  return Object.keys(S.days).sort().filter(k=>num(S.days[k].weight)>0).map(k=>({d:k,w:num(S.days[k].weight)}));
}
function avg7(ws, end){
  const pts = ws.filter(x=>x.d<=end && diff(end,x.d)<7);
  return pts.length ? pts.reduce((a,b)=>a+b.w,0)/pts.length : null;
}
function chart(ws){
  if(ws.length < 2) return `<div class="chart"><p class="empty">Log your weight on a few mornings to see your trend here.</p></div>`;
  const pts = ws.slice(-60), W=320, H=150, pad=18;
  const vals = pts.map(p=>p.w), mn = Math.min(...vals)-1, mx = Math.max(...vals)+1;
  const t0 = parse(pts[0].d), span = Math.max(diff(pts[pts.length-1].d, pts[0].d),1);
  const X = d => pad + (W-2*pad) * (diff(d, fmt(t0))/span);
  const Y = w => H-pad - (H-2*pad) * ((w-mn)/(mx-mn));
  const dots = pts.map(p=>`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="3" style="fill:var(--muted);opacity:.55"/>`).join("");
  const line = pts.map((p,i)=>`${i?"L":"M"}${X(p.d).toFixed(1)},${Y(avg7(ws,p.d)).toFixed(1)}`).join(" ");
  return `<div class="chart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend from ${pts[0].d} to ${pts[pts.length-1].d}">
      <text x="${pad}" y="12" style="font:11px var(--body);fill:var(--muted)">${mx.toFixed(0)} lb</text>
      <text x="${pad}" y="${H-4}" style="font:11px var(--body);fill:var(--muted)">${mn.toFixed(0)} lb</text>
      ${dots}<path d="${line}" style="fill:none;stroke:var(--carbs);stroke-width:2.5;stroke-linejoin:round"/>
    </svg>
    <div class="legend"><span><i class="sw" style="background:var(--muted);opacity:.55"></i>Daily</span><span><i class="sw" style="background:var(--carbs)"></i>7-day average</span></div>
  </div>`;
}

let F = null, bi = 0, bview = "q";
function visibleQ(){ return F.qs.filter(q=>!q.only || q.only(F.a)); }
const optsOf = q => typeof q.opts === "function" ? q.opts(F.a) : q.opts;
const fieldsOf = q => typeof q.fields === "function" ? q.fields(F.a) : q.fields;
function openFlow(flow){ F = flow; bi = 0; bview = "q"; $("#builder").hidden = false; document.body.classList.add("on-home"); renderBuilder(); }
function closeBuilder(){ $("#builder").hidden = true; document.body.classList.remove("on-home"); render(); }
function answered(q){
  if(q.type==="fields") return !(q.check && q.check(F.a));
  const v = F.a[q.k];
  if(q.multi) return Array.isArray(v) && v.length>0;
  return v!==undefined && v!=="" && optsOf(q).some(o=>String(o[0])===String(v));
}
function renderBuilder(){
  const qs = visibleQ(), el = $("#builder");
  if(bview==="sum") return F.summary(el);
  if(bi >= qs.length) bi = qs.length-1;
  const q = qs[bi];
  if(q.dflt && F.a[q.k]===undefined) F.a[q.k] = q.dflt;
  const pct = Math.round((bi)/(qs.length)*100);
  let body;
  if(q.type==="fields"){
    body = `<div class="flds">${fieldsOf(q).map(f=>`<div class="field${f.wide?" wide":""}"><label for="q-${f.k}">${esc(f.label)}</label><input id="q-${f.k}" data-fk="${f.k}" type="${f.type==="date"?"date":"text"}" ${f.type==="number"?'inputmode="decimal"':""} value="${esc(F.a[f.k]??"")}">${f.tip?`<div class="tip">${esc(f.tip)}</div>`:""}</div>`).join("")}</div>`;
  } else {
    const val = F.a[q.k];
    const sel = o => q.multi ? (val||[]).includes(o) : String(val)===String(o);
    body = `<div class="opts" role="${q.multi?"group":"radiogroup"}">${optsOf(q).map(([v,l,sub])=>`<button class="opt${q.multi?"":" single"}" data-opt="${esc(v)}" aria-pressed="${sel(v)}" role="${q.multi?"checkbox":"radio"}" aria-checked="${sel(v)}"><span class="box">${sel(v)?"✓":""}</span><span>${esc(l)}${sub?`<small>${esc(sub)}</small>`:""}</span></button>`).join("")}</div>`;
  }
  el.innerHTML = `<div class="in">
    <div class="top"><button class="iconbtn" data-b="close" aria-label="Close">✕</button><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><span class="sub" style="margin:0">${bi+1} of ${qs.length}</span></div>
    <h2>${esc(q.t)}</h2>${q.sub?`<p class="sub">${esc(q.sub)}</p>`:""}
    ${body}
    <div class="err" id="berr" role="alert"></div></div>
    <div class="bnav"><div class="in2"><button data-b="back"${bi===0?" disabled":""}>Back</button><button class="next" data-b="next">${bi===qs.length-1?F.lastLabel:"Next"}</button></div></div>`;
  el.scrollTop = 0;
}
$("#builder").addEventListener("input", e=>{ const k = e.target.dataset.fk; if(k){ F.a[k] = e.target.value.trim(); $("#berr").textContent = ""; } });
$("#builder").addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  const qs = visibleQ(), q = qs[bi];
  if(t.dataset.b==="close"){ closeBuilder(); return; }
  if(t.dataset.opt!==undefined){
    const v = t.dataset.opt;
    if(q.multi){
      let arr = (F.a[q.k]||[]).slice();
      if(arr.includes(v)) arr = arr.filter(x=>x!==v);
      else {
        if(v===q.none) arr = [];
        else arr = arr.filter(x=>x!==q.none);
        (q.excl||[]).forEach(g=>{ if(g.includes(v)) arr = arr.filter(x=>!g.includes(x)); });
        arr.push(v);
      }
      F.a[q.k] = arr; renderBuilder();
    } else {
      F.a[q.k] = v; renderBuilder();
      setTimeout(()=>{ if(bview==="q" && visibleQ()[bi]===q){ next(); } }, 220);
    }
    return;
  }
  if(t.dataset.b==="back"){ if(bview==="sum"){ bview="q"; bi = visibleQ().length-1; } else if(bi>0) bi--; renderBuilder(); return; }
  if(t.dataset.b==="next"){ next(); return; }
  if(t.dataset.b==="start"){ F.start(); return; }
});

  if(bi < qs.length-1){ bi++; renderBuilder(); } else { bview = "sum"; renderBuilder(); }
}

$("#builder").addEventListener("change", e=>{
  const k = e.target.dataset.got; if(!k) return;
  S.mealplan.got = S.mealplan.got || {}; S.mealplan.got[k] = e.target.checked;
  e.target.closest("label").classList.toggle("got", e.target.checked); cacheLocal();
});

/* ---------- barcode scanner ---------- */
let scanStream = null, scanTimer = null, scanBusy = false, zxReader = null, detector = null;
function loadZXing(){
  if(window.ZXing) return Promise.resolve();
  return new Promise((res, rej)=>{ const sc = document.createElement("script"); sc.src = "vendor/zxing.min.js"; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
}
async function openScanner(){
  const el = $("#scanner"); el.hidden = false; document.body.classList.add("on-home");
  $("#scancode").value = ""; $("#scanmsg").textContent = "Starting camera…";
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ $("#scanmsg").textContent = "The camera isn't available here. Type the number instead."; return; }
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
  }catch(e){ $("#scanmsg").textContent = "Camera access was blocked. Allow it in Settings, or type the number instead."; return; }
  const v = $("#scanvid"); v.srcObject = scanStream; try{ await v.play(); }catch(e){}
  $("#scanmsg").textContent = "Point your camera at the barcode";
  try{
    if("BarcodeDetector" in window){
      const fm = await BarcodeDetector.getSupportedFormats();
      if(["ean_13","upc_a"].every(f=>fm.includes(f))) detector = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
    }
  }catch(e){ detector = null; }
  if(!detector){
    try{ await loadZXing(); }catch(e){ $("#scanmsg").textContent = "The scanner didn't load. Type the number instead."; return; }
    const Z = window.ZXing, hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    zxReader = new Z.MultiFormatReader(); zxReader.setHints(hints);
  }
  scanLoop();
}
const scanCanvas = document.createElement("canvas");
async function scanLoop(){
  clearTimeout(scanTimer);
  if(!scanStream) return;
  const v = $("#scanvid");
  if(v.readyState >= 2 && v.videoWidth){
    try{
      let code = null;
      if(detector){
        const r = await detector.detect(v); if(r.length) code = r[0].rawValue;
      } else {
        // decode the band inside the on-screen frame, where people aim
        const w = v.videoWidth, h = v.videoHeight, cw = Math.round(w*0.9), ch = Math.round(h*0.4);
        scanCanvas.width = cw; scanCanvas.height = ch;
        const cx = scanCanvas.getContext("2d", {willReadFrequently:true});
        cx.drawImage(v, (w-cw)/2, (h-ch)/2, cw, ch, 0, 0, cw, ch);
        try{
          const Z = window.ZXing;
          const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(scanCanvas)));
          code = zxReader.decode(bmp).getText();
        }catch(e){ code = null; }
      }
      if(code){ foundCode(code); return; }
    }catch(e){}
  }
  scanTimer = setTimeout(scanLoop, 120);
}
function stopScanner(){
  clearTimeout(scanTimer); scanTimer = null;
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
  const v = $("#scanvid"); if(v) v.srcObject = null;
  $("#scanner").hidden = true;
}
function closeScanner(){ stopScanner(); document.body.classList.remove("on-home"); }
$("#scanclose").addEventListener("click", closeScanner);
$("#scantype").addEventListener("submit", e=>{ e.preventDefault(); const c = $("#scancode").value.replace(/\D/g,""); if(c.length<6){ $("#scanmsg").textContent = "Enter the full number under the barcode."; return; } foundCode(c); });

function normCode(c){ c = String(c).replace(/\D/g,""); return c.length===12 ? "0"+c : c; } // UPC-A to EAN-13
async function foundCode(raw){
  if(scanBusy) return; scanBusy = true;
  const code = normCode(raw);
  stopScanner();
  S.foods = S.foods || {};
  let food = S.foods[code] || S.foods[String(raw)];
  if(!food){
    openSheet("Scanned food", `<p class="sub">Looking up ${esc(code)}…</p>`);
    food = await lookupOFF(code, raw);
    if(food && food.found){ S.foods[code] = food; cacheLocal(); }
  }
  scanBusy = false;
  if(food && food.found) showFood(code, food);
  else manualFood(code, food && food.offline);
}
async function lookupOFF(code, raw){
  const fields = "code,product_name,product_name_en,generic_name,brands,serving_size,serving_quantity,nutriments";
  const tryOne = async c => {
    const ctl = new AbortController(), to = setTimeout(()=>ctl.abort(), 8000);
    try{
      const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(c)}.json?fields=${fields}`, {signal:ctl.signal});
      const j = await r.json().catch(()=>null);
      return j;
    } finally { clearTimeout(to); }
  };
  try{
    let j = await tryOne(code);
    if((!j || j.status!==1) && String(raw)!==code) j = await tryOne(String(raw));
    if(!j || j.status!==1 || !j.product) return {found:false};
    return parseOFF(j.product);
  }catch(e){ return {found:false, offline:true}; }
}
function parseOFF(p){
  const n = p.nutriments || {}, num_ = v => (v===undefined || v===null || v==="") ? null : +v;
  const per100 = {p:num_(n.proteins_100g), c:num_(n.carbohydrates_100g), f:num_(n.fat_100g)};
  const perServ = {p:num_(n.proteins_serving), c:num_(n.carbohydrates_serving), f:num_(n.fat_serving)};
  const sq = num_(p.serving_quantity);
  let per = null, label = "", grams = null;
  if(sq && per100.p!==null && per100.c!==null && per100.f!==null){ per = {p:per100.p*sq/100, c:per100.c*sq/100, f:per100.f*sq/100}; grams = sq; label = p.serving_size || `${sq} g`; }
  else if(perServ.p!==null && perServ.c!==null && perServ.f!==null){ per = perServ; label = p.serving_size || "1 serving"; }
  else if(per100.p!==null && per100.c!==null && per100.f!==null){ per = per100; grams = 100; label = "100 g"; }
  const name = (p.product_name || p.product_name_en || p.generic_name || "").trim();
  if(!per || !name) return {found:false};
  const r1 = x => Math.round(x*10)/10;
  return {found:true, name, brand:(p.brands||"").split(",")[0].trim(), label, grams, per:{p:r1(per.p), c:r1(per.c), f:r1(per.f)}, src:"off"};
}
let FOODCTX = null;
function showFood(code, food){
  FOODCTX = {code, food, qty:1};
  openSheet("Scanned food", foodHTML());
}
function foodHTML(){
  const {food, qty} = FOODCTX, m = k => Math.round(food.per[k]*qty);
  const cal = Math.round(food.per.p*4*qty + food.per.c*4*qty + food.per.f*9*qty);
  return `<div class="food">${food.brand?`<div class="brand">${esc(food.brand)}</div>`:""}<div class="fn">${esc(food.name)}</div>
    <div class="sub" style="margin:0">1 serving = ${esc(food.label)}${food.src==="me"?" (your entry)":""}</div>
    <div class="stepper"><button type="button" data-q="-1" aria-label="Less">−</button><input id="fqty" inputmode="decimal" value="${qty}" aria-label="Servings"><button type="button" data-q="1" aria-label="More">+</button><span>serving${qty===1?"":"s"}</span></div>
    <dl class="kv"><dt>Calories</dt><dd>${cal}</dd><dt>Protein</dt><dd>${m("p")} g</dd><dt>Carbs</dt><dd>${m("c")} g</dd><dt>Fat</dt><dd>${m("f")} g</dd></dl>
    <button class="primary" data-act="food-add">Add to ${cur===todayStr()?"today":"this day"}</button>
    <div class="acts" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="linkbtn" data-act="food-edit">Numbers look wrong? Fix them</button><button class="linkbtn" data-act="food-rescan">Scan another</button></div></div>
    ${food.src==="off"?`<p class="tip">From Open Food Facts. Labels change, so check it against the package now and then.</p>`:""}`;
}
function manualFood(code, offline, prefill){
  const f = prefill || {};
  FOODCTX = {code, manual:true};
  openSheet(prefill ? "Fix this food" : "Add this food", `
    <p class="sub">${prefill ? "Update the numbers from the label. Adonis remembers your version for this barcode." : offline ? "You're offline, so this barcode can't be looked up right now. Enter it from the label and Adonis will remember it." : "This barcode isn't in the food database yet. Enter it once from the nutrition label and Adonis will remember it next time."}</p>
    <div class="card"><div class="row">
      <div class="field wide"><label for="mf-name">Food name</label><input id="mf-name" value="${esc(f.name||"")}" placeholder="e.g. Protein bar"></div>
      <div class="field wide"><label for="mf-label">Serving size on the label</label><input id="mf-label" value="${esc(f.label||"")}" placeholder="e.g. 1 bar (60 g)"></div>
      <div class="field"><label for="mf-p">Protein g</label><input id="mf-p" inputmode="decimal" value="${f.per?esc(f.per.p):""}"></div>
      <div class="field"><label for="mf-c">Carbs g</label><input id="mf-c" inputmode="decimal" value="${f.per?esc(f.per.c):""}"></div>
      <div class="field"><label for="mf-f">Fat g</label><input id="mf-f" inputmode="decimal" value="${f.per?esc(f.per.f):""}"></div>
    </div><p class="tip">Per one serving, the way the label shows it. Barcode ${esc(code)}.</p>
    <div class="err" id="mf-err" role="alert"></div>
    <button class="primary" data-act="food-save">Save and continue</button></div>`);
}
document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.act==="scan"){ scanBusy = false; openScanner(); return; }
  if(t.dataset.q && FOODCTX){ FOODCTX.qty = Math.max(0.5, Math.round((FOODCTX.qty + (+t.dataset.q)*0.5)*2)/2); openSheet("Scanned food", foodHTML()); return; }
  if(t.dataset.act==="food-add" && FOODCTX){
    const {food, qty, code} = FOODCTX, D = day(cur), r = x => Math.round(x*qty);
    const nm = `${food.name}${qty!==1?` (${qty} servings)`:""}`;
    D.food.push({name:nm, p:r(food.per.p), c:r(food.per.c), f:r(food.per.f), code});
    saveDay(cur); closeBuilder(); setStatus(`Added ${food.name}`); return;
  }
  if(t.dataset.act==="food-edit" && FOODCTX){ manualFood(FOODCTX.code, false, FOODCTX.food); return; }
  if(t.dataset.act==="food-rescan"){ closeBuilder(); scanBusy = false; openScanner(); return; }
  if(t.dataset.act==="food-save" && FOODCTX){
    const name = $("#mf-name").value.trim(), label = $("#mf-label").value.trim() || "1 serving";
    const p = num($("#mf-p").value), c = num($("#mf-c").value), f = num($("#mf-f").value);
    if(!name){ $("#mf-err").textContent = "Enter a name for this food."; return; }
    if(!p && !c && !f){ $("#mf-err").textContent = "Enter protein, carbs or fat from the label."; return; }
    const food = {found:true, name, brand:"", label, per:{p, c, f}, src:"me"};
    S.foods = S.foods || {}; S.foods[FOODCTX.code] = food; cacheLocal();
    showFood(FOODCTX.code, food); return;
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="fqty" && FOODCTX){ const v = num(e.target.value); if(v>0){ FOODCTX.qty = v; const kv = $("#builder .kv"); if(kv){ const {food, qty} = FOODCTX; kv.innerHTML = `<dt>Calories</dt><dd>${Math.round((food.per.p*4+food.per.c*4+food.per.f*9)*qty)}</dd><dt>Protein</dt><dd>${Math.round(food.per.p*qty)} g</dd><dt>Carbs</dt><dd>${Math.round(food.per.c*qty)} g</dd><dt>Fat</dt><dd>${Math.round(food.per.f*qty)} g</dd>`; } } }
});

loadLocal();
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
